            <td style="min-width:190px">${esc(e.empresa.razon)}<div class="mini mut">${MODALIDADES[e.servicio.modalidad].nombre}</div></td>
            <td class="peq" style="min-width:140px">${e.etapa}. ${ETAPAS[e.etapa - 1].nombre}</td>
            <td class="der num">${['en_curso', 'observado'].includes(e.estado) ? dec1(diasEnEtapa(e)) : '—'}</td>
            <td>${chipSemaforo(e)}</td>
            <td>${chipRiesgo(e.riesgo)}</td>
            <td class="der num">${hallazgosAbiertos(e) ? `<span class="chip aviso">${hallazgosAbiertos(e)}</span>` : '<span class="mut-3">0</span>'}</td>
            <td>${chipEstado(e)}</td>
          </tr>`).join('')}</tbody></table></div>`
        : `<div class="exito"><div class="sello" style="background:var(--ok-suave);color:var(--verde-osc);box-shadow:none">${icono('check', 'g')}</div><h3>No tienes expedientes pendientes</h3><p class="mut peq" style="margin-top:6px">Cuando un expediente necesite a ${r.nombre}, aparece aquí.</p></div>`}
    </div>
    <p class="mini mut" style="margin-top:10px">El semáforo lo calcula el sistema con el SLA de cada etapa, que se edita en la Consola (Reglas y SLA).</p>`
}

function tabPorDefecto(exp, rol) {
  if (AREAS_EVAL.includes(rol) && exp.etapa === 3) return 'evaluacion'
  if (rol === 'comercial' && exp.etapa === 4) return 'oferta'
  if (rol === 'legal' && exp.etapa === 5) return 'convenio'
  if (rol === 'legal' && exp.etapa === 6) return 'firma'
  return 'resumen'
}

function expediente360(exp) {
  const tabs = [
    ['resumen', 'Resumen'],
    ['documentos', 'Documentos', hallazgosAbiertos(exp)],
    ['evaluacion', 'Evaluación'],
    ['oferta', 'Oferta'],
    ['convenio', 'Convenio'],
    ['firma', 'Firma'],
    ['traza', 'Trazabilidad'],
  ]
  const t = ui.bo.tab
  const contenido = { resumen: tabResumen, documentos: tabDocumentos, evaluacion: tabEvaluacion, oferta: tabOferta, convenio: tabConvenio, firma: tabFirma, traza: tabTraza }[t](exp)
  return `<button class="btn txt" data-a="cerrar-exp" style="margin:-6px 0 8px -8px">${icono('volver', 'p')}${ui.bo.seccion === 'todos' ? 'Todos los expedientes' : 'Mi bandeja'}</button>
    <div class="tarjeta">
      <div class="exp-cab">
        <div>
          <div class="fila" style="gap:8px"><span class="num mut neg">${exp.id}</span>${chipEstado(exp)}${chipSemaforo(exp)}${exp.riesgo ? `<span class="chip">Riesgo ${exp.riesgo.nivel.toLowerCase()}</span>` : ''}</div>
          <h2 style="margin-top:6px">${esc(exp.empresa.razon)}</h2>
          <div class="datos"><span>NIT <b class="num">${esc(exp.empresa.nit)}</b></span><span>${TIPOS_EMPRESA[exp.empresa.tipo]}</span><span>${MODALIDADES[exp.servicio.modalidad].nombre}</span><span class="num">${num(exp.servicio.volumen)} pagos/mes</span>${exp.asesor ? `<span>Asesor: ${esc(exp.asesor)}</span>` : ''}</div>
        </div>
        <div class="caja-hum" style="min-width:240px"><div class="mini mut">Siguiente paso</div><div class="neg peq" style="color:var(--verde-prof)">${esc(siguientePaso(exp))}</div></div>
      </div>
      <div style="margin-top:16px">${etapasHTML(exp)}</div>
    </div>
    <div class="pestanas" role="tablist">${tabs.map(([k, n, c]) => `<button class="pestana ${t === k ? 'act' : ''}" data-a="bo-tab" data-v="${k}" id="tab-${k}">${n}${c ? ` <span class="cuenta">${c}</span>` : ''}</button>`).join('')}</div>
    ${contenido}`
}

const aunNo = (n) => `<div class="tarjeta plana"><p class="mut">Este expediente todavía no llega a la etapa ${n} (${ETAPAS[n - 1].nombre}).</p></div>`

function tabResumen(exp) {
  const e = exp.empresa, s = exp.servicio
  const datos = (filas) => filas.map(([k, v]) => `<div class="fila-e peq" style="padding:6px 0;border-bottom:1px dashed var(--borde)"><span class="mut">${k}</span><b style="text-align:right">${esc(v)}</b></div>`).join('')
  const alerta = semaforo(exp), enviada = alertaVigente(exp)
  return `<div class="grid-2">
    <div class="tarjeta"><h3>Empresa</h3><div style="margin-top:8px">${datos([
      ['Razón social', e.razon], ['NIT', e.nit], ['Tipo', TIPOS_EMPRESA[e.tipo]], ['Actividad', e.actividad || CLASE_TXT[e.clase]],
      ['Constituida', e.constitucion], ['Cliente desde', e.clienteDesde], ['Representante', e.representante.nombre],
    ])}</div></div>
    <div class="tarjeta"><h3>Servicio solicitado</h3><div style="margin-top:8px">${datos([
      ['Modalidad', MODALIDADES[s.modalidad].nombre], ['Pagos al mes', num(s.volumen)], ['Monto promedio', q(s.monto)],
      ['Recaudo estimado', q(s.volumen * s.monto) + ' al mes'], ['Cheques de otros bancos', s.cheques ? 'Sí' : 'No'],
      ['Acreditación', s.acreditacion === 't0' ? 'Mismo día (especial)' : 'Día hábil siguiente'], ['Cuenta', s.cuenta],
    ])}</div></div>
  </div>
  ${exp.obs.length ? `<div class="tarjeta" style="margin-top:16px"><h3>Observaciones</h3><div class="col" style="margin-top:10px;gap:8px">${exp.obs.map((o) => `<div class="aviso-linea ${o.estado === 'abierta' ? 'aviso' : 'ok'}">${icono(o.estado === 'abierta' ? 'alerta' : 'check')}<span><b>${o.area === 'validacion' ? 'Validación' : ROLES[o.area].nombre}</b> · ${esc(o.texto)}${o.respuesta ? `<br><i>Respuesta: ${esc(o.respuesta)}</i>` : ''}</span></div>`).join('')}</div></div>` : ''}
  ${alerta && alerta.nivel === 'error' ? cajaSeguimiento(alerta, enviada) : ''}`
}

// El texto se atribuye al Agente 6 solo si lo redactó: hay una alerta con sus eventos y el agente estaba activo.
function cajaSeguimiento(alerta, enviada) {
  const detecto = `El vencimiento lo detectó el sistema (${dec1(alerta.dias)} días ≥ SLA de ${alerta.sla})`
  if (!enviada) return `<div class="caja-sis" style="margin-top:16px"><div class="cab">${icono('sistema', 'p')}SLA vencido ${chipActor('sis')}</div><p class="mini mut" style="margin-top:6px">${detecto}. La alerta sale con la próxima revisión.</p></div>`
  const cab = enviada.porIA ? `<div class="caja-ia" style="margin-top:16px"><div class="cab">${icono('chispa', 'p')}Agente 6 · Seguimiento ${chipActor('ia')}` : `<div class="caja-sis" style="margin-top:16px"><div class="cab">${icono('sistema', 'p')}Aviso fijo (Agente 6 en pausa) ${chipActor('sis')}`
  return `${cab}</div><p class="peq">${esc(enviada.mensaje)}</p><p class="mini mut" style="margin-top:6px">${detecto}; ${enviada.porIA ? 'el agente solo redactó el aviso y ' : 'con el agente en pausa, '}el sistema lo envió a ${esc(enviada.para)} (${esc(enviada.rol)}) el ${fechaHora(enviada.t)}.</p></div>`
}

function tabDocumentos(exp) {
  const rol = ui.rol, pedir = puedePedirDocs(exp, rol), revisar = puedeRevisarDocs(exp, rol)
  const pedido = (d) => exp.obs.find((o) => o.doc === d.tipo && o.estado === 'abierta')
  const filas = exp.docs.map((d) => {
    const vig = !d.archivo ? '<span class="chip error">Falta</span>' : d.vence ? (() => { const dias = diasHasta(d.vence); return dias < 0 ? `<span class="chip error">Vencido hace ${-dias} d</span>` : dias <= 90 ? `<span class="chip aviso">Vence en ${dias} d</span>` : `<span class="chip ok">Vigente · ${isoAFecha(d.vence)}</span>` })() : '<span class="mut-3">No aplica</span>'
    const o = pedido(d)
    const versiones = (d.historial || []).length ? `<div class="mini mut">Versiones: ${d.historial.map((h) => `v${h.version} ${esc(h.archivo)} (${fecha(h.t)})`).join(' → ')} → v${d.version}</div>` : ''
    const clasif = d.clasif ? ` · ${d.clasif.por === 'ia' ? `reconocido por el Agente 1 (${Math.round(d.clasif.confianza * 100)} %)` : 'clasificado a mano'}` : ''
    const acciones = o
      ? `<span class="chip aviso">Pedido a la empresa</span>`
      : [
        revisar && d.archivo && !d.revisado ? `<button class="btn txt chico" data-a="doc-revisado" data-v="${d.tipo}">${icono('check', 'p')}Marcar revisado</button>` : '',
        pedir && d.archivo ? `<button class="btn txt chico" data-a="abrir-pedir-doc" data-v="${d.tipo}">${icono('reinicio', 'p')}Pedir nueva versión</button>` : '',
      ].join('')
    return `<tr><td><b>${DOC_TIPOS[d.tipo].nombre}</b>${d.adicional ? ' <span class="chip">adicional</span>' : ''}<div class="mini mut">${d.archivo ? `${esc(d.archivo)} · versión ${d.version || 1}${clasif}` : 'Sin archivo'}</div>${versiones}
        ${d.revisado ? `<div class="mini" style="color:var(--hum)">${icono('check', 'p')}Revisado por ${esc(d.revisado.por)} (${esc(d.revisado.area)}) · ${fechaHora(d.revisado.t)}</div>` : ''}</td>
      <td>${d.campos ? `<div class="extraido">${Object.entries(d.campos).map(([k, v]) => `<span>${k}: <b>${esc(v)}</b></span>`).join('')}</div>` : '<span class="mut-3 peq">—</span>'}</td>
      <td>${vig}</td><td><div class="col" style="gap:2px;align-items:flex-start">${acciones || '<span class="mut-3">—</span>'}</div></td></tr>`
  }).join('')
  const adicionales = Object.keys(DOC_TIPOS).filter((t) => DOC_TIPOS[t].adicional && !exp.docs.some((d) => d.tipo === t))
  const nivel = { bloqueante: 'error', aviso: 'aviso', info: '' }
  const nota = pedir ? '' : revisar ? `<p class="mini mut" style="margin-top:8px">Pedir documentos lo hacen las áreas que evalúan (etapa 3) y Legal (etapa 5) mientras tienen la decisión pendiente.</p>` : `<p class="mini mut" style="margin-top:8px">Las acciones sobre documentos están disponibles en las etapas 3 a 5.</p>`
  return `<div class="tarjeta" style="padding:8px 8px 4px"><div class="envoltura-tabla"><table class="tabla" id="tabla-docs">
      <thead><tr><th>Documento</th><th>Datos extraídos ${chipActor('ia')}</th><th>Vigencia ${chipActor('sis')}</th><th>Gestión ${chipActor('hum')}</th></tr></thead><tbody>${filas}</tbody></table></div>
      <div style="padding:4px 8px 8px">${pedir && adicionales.length ? `<div class="fila" style="gap:8px;margin-top:8px"><span class="peq neg">Pedir un documento adicional:</span>${adicionales.map((t) => `<button class="chip" data-a="abrir-pedir-doc" data-v="${t}">${icono('subir', 'p')}${DOC_TIPOS[t].nombre}</button>`).join('')}</div>` : ''}${nota}</div></div>
    ${(exp.generados || []).length ? `<div class="tarjeta" style="margin-top:16px" id="docs-generados"><h3>Generados por el proceso · gestor documental</h3>
      <p class="mut peq" style="margin-top:4px">Los archivó el sistema al cerrar la firma. Son los mismos que se descargan desde la pestaña Firma.</p>
      <div class="col" style="margin-top:10px;gap:8px">${exp.generados.map((g) => `<div class="fila-e" style="gap:10px;padding:8px 0;border-bottom:1px dashed var(--borde)"><span><b>${esc(g.nombre)}</b><br><span class="mini mut">${esc(g.archivo)} · ${fechaHora(g.t)}${g.huella ? ` · SHA-256 <span class="webhook">${g.huella.slice(0, 16)}…</span>` : ''}</span></span><button class="btn sec chico" data-a="descargar" data-exp="${exp.id}" data-v="${g.v}">${icono('doc', 'p')}Descargar</button></div>`).join('')}</div></div>` : ''}
    <div class="tarjeta" style="margin-top:16px">
      <h3>Hallazgos</h3>
      <p class="mut peq" style="margin-top:4px">El agente clasifica, extrae y compara; el sistema cuenta los faltantes y calcula las vigencias. Ninguno cambia el estado por su cuenta.</p>
      <div class="col" style="margin-top:12px;gap:8px">${exp.hallazgos.length ? exp.hallazgos.map((h) => `<div class="fila" style="gap:10px;align-items:flex-start;flex-wrap:nowrap;padding:8px 0;border-bottom:1px dashed var(--borde)">
          ${incAclarada(exp, h) ? '<span class="chip ok">aclarado</span>' : `<span class="chip ${nivel[h.nivel]}">${h.nivel}</span>`}
          <span class="peq" style="flex:1;min-width:0">${esc(h.texto)}<br><span class="mini mut">Evidencia: ${h.pag ? `${DOC_TIPOS[h.doc].nombre}, pág. ${h.pag}` : `lista de documentos de ${minuscula(TIPOS_EMPRESA[exp.empresa.tipo])}`}${h.calculo ? ` · cálculo: ${esc(h.calculo)}` : ''}${h.inc ? ` · MIS<br>${estadoInc(exp, h.inc)}` : ''}</span></span>
          ${chipActor(h.origen)}</div>`).join('') : '<p class="mut peq">Sin hallazgos registrados.</p>'}</div>
    </div>`
}

function estadoInc(exp, id) {
  const i = (exp.inconsistencias || []).find((x) => x.id === id)
  if (!i) return ''
  return i.estado === 'abierta'
    ? `<span class="mini" style="color:var(--aviso)">Pendiente: la aclara Cumplimiento antes de aprobar.</span>`
    : `<span class="mini">Aclarada por <b>${esc(i.por)}</b> el ${fechaHora(i.aclarada)}: «${esc(i.nota)}»</span>`
}

function cajaDecision(exp, area) {
  const ev = exp.evaluacion[area]
  if (ev.estado !== 'pendiente') {
    return `<div class="caja-hum"><div class="cab">${icono('banco', 'p')}Decisión de ${ROLES[area].nombre} ${chipDecision(ev.estado)}</div><p class="peq"><b>${esc(ev.por)}</b> · ${fechaHora(ev.t)}</p>${ev.comentario ? `<p class="peq" style="margin-top:4px">«${esc(ev.comentario)}»</p>` : ''}</div>`
  }
  if (exp.estado === 'rechazado') return `<div class="bloqueado">${icono('candado', 'p')}Expediente cerrado.</div>`
  if (ui.rol !== area) return `<div class="bloqueado">${icono('candado', 'p')}Decide ${ROLES[area].nombre}. Cambia «Ver como» para decidir aquí.</div>`
  const bloquea = area === 'cumplimiento' && incAbiertas(exp).length > 0
  return `<div class="caja-hum" id="decision-${area}"><div class="cab">${icono('banco', 'p')}Tu decisión · ${ROLES[area].nombre}</div>
    <p class="peq mut">La recomendación de la IA no cambia el estado; lo cambia tu decisión.</p>
    ${bloquea ? `<p class="mini" style="color:var(--aviso);margin-top:4px">Para aprobar, primero aclara la diferencia que señaló el Agente 1.</p>` : ''}
    <div class="decision">
      <button class="btn vrd chico" data-a="decidir" data-area="${area}" data-v="aprobado" id="aprobar-${area}"${bloquea ? ' disabled' : ''}>${icono('check', 'p')}Aprobar</button>
      <button class="btn aviso chico" data-a="abrir-decision" data-area="${area}" data-v="observado">Observar</button>
      <button class="btn peligro chico" data-a="abrir-decision" data-area="${area}" data-v="rechazado">Rechazar</button>
    </div></div>`
}

// Caja de un agente: si estaba en pausa, el trabajo lo hizo una persona y la caja lo dice. Sin «por» (estado guardado
// de antes) se toma como del agente, que es como se rotulaba.
const cajaAgente = (por, rotulo) => (!por || por.actor === 'ia'
  ? `<div class="caja-ia"><div class="cab">${icono('chispa', 'p')}${rotulo}`
  : `<div class="caja-hum"><div class="cab">${icono('persona', 'p')}${esc(por.quien)}`)

function tabEvaluacion(exp) {
  if (!exp.evaluacion) return aunNo(3)
  const iaC = exp.ia.comercial, iaCu = exp.ia.cumplimiento, r = exp.riesgo
  const col = (area, contenido) => `<div class="tarjeta col-eval" id="col-${area}"><div class="titulo"><h3>${ROLES[area].nombre}</h3>${chipDecision(exp.evaluacion[area].estado)}</div>${contenido}${cajaDecision(exp, area)}</div>`
  return `<div class="aviso-linea info" style="margin-bottom:14px">${icono('escudo')}<span><b>La IA prepara; las personas deciden.</b> Las tres áreas trabajan en paralelo y ninguna recomendación cambia el estado del expediente.</span></div>
  <div class="grid-3">
    ${col('comercial', `${cajaAgente(iaC.por, 'Agente 3 · Asistente Comercial')}</div><p class="peq">${esc(iaC.resumen)}</p><p class="peq" style="margin-top:8px"><b>Recomendación:</b> ${esc(iaC.recomendacion)}</p><p class="mini mut" style="margin-top:6px">${esc(iaC.nota)}</p></div>`)}
    ${col('riesgos', `<div class="caja-sis"><div class="cab">${icono('sistema', 'p')}Matriz por reglas · la calcula el sistema</div>
      ${r.reglas.map((x) => `<div class="regla"><span>${x.nombre}<br><span class="mini mut">${esc(x.valor)}</span></span><span class="num neg">${x.pts}</span><span class="mini mut">pt</span></div>`).join('')}
      <div class="fila-e" style="margin-top:10px"><b>Total ${r.puntos} puntos</b>${chipRiesgo(r)}</div>
      <p class="mini mut" style="margin-top:6px">${r.version} · ≤ ${r.bajo} bajo · ${r.bajo + 1}–${r.medio} medio · ≥ ${r.medio + 1} alto. No hay agente de Riesgos (hallazgo H2).</p></div>`)}
    ${col('cumplimiento', `<div class="caja-sis"><div class="cab">${icono('sistema', 'p')}Listas de control · sistema</div><p class="peq">${esc(((exp.eventos.findLast((e) => e.accion === 'Consultó listas de control') || {}).detalle) || 'Sin coincidencias para la empresa y el representante')}.</p></div>
      ${cajaAgente(iaCu.por, 'Agente 2 · Asistente de Cumplimiento')}</div><p class="peq">${esc(iaCu.resumen)}</p>
      <ul class="lista-check" style="margin-top:10px">${iaCu.checklist.map((c) => `<li>${c.ok === true ? `<span style="color:var(--ok)">${icono('check', 'p')}</span>` : `<span style="color:var(--aviso)">${icono('alerta', 'p')}</span>`}<span>${esc(c.txt)}${c.evidencia ? `<br><span class="mini mut">Evidencia: ${esc(c.evidencia)}</span>` : ''}</span></li>`).join('')}</ul>
      <details style="margin-top:10px"><summary class="peq neg" style="cursor:pointer;color:var(--ia)">Ver borrador del informe</summary><p class="peq" style="margin-top:6px">${esc(iaCu.informe)}</p></details></div>
      ${(exp.inconsistencias || []).map((i) => `<div class="caja-hum" id="inc-${i.id}"><div class="cab">${icono(i.estado === 'abierta' ? 'alerta' : 'check', 'p')}${i.estado === 'abierta' ? 'Por aclarar' : 'Aclarada'} · lo señaló el Agente 1</div>
        <p class="peq">${esc(i.texto)}</p><p class="mini mut" style="margin-top:4px">Evidencia: ${esc(i.evidencia)}</p><p style="margin-top:4px">${estadoInc(exp, i.id)}</p>
        ${i.estado === 'abierta' && ui.rol === 'cumplimiento' && exp.evaluacion.cumplimiento.estado === 'pendiente' && exp.estado !== 'rechazado' ? `<div style="margin-top:8px"><button class="btn sec chico" data-a="abrir-aclarar" data-id="${i.id}" id="btn-aclarar-${i.id}">Aclarar la diferencia</button></div>` : ''}</div>`).join('')}`)}
  </div>`
}

function tabOferta(exp) {
  const o = exp.oferta
  if (!o) return aunNo(4)
  const s = exp.servicio
  let acciones = ''
  if (ui.rol === 'comercial' && exp.etapa === 4) {
    if (o.estado === 'borrador') acciones = `<div class="caja-hum"><div class="cab">${icono('banco', 'p')}Tu decisión · Comercial</div><p class="peq">Revisa el cálculo y el texto. Al enviar, la oferta le llega al cliente.</p><button class="btn vrd" style="margin-top:10px" data-a="enviar-oferta" id="btn-enviar-oferta">Enviar oferta al cliente</button></div>`
    if (o.estado === 'vencida') acciones = `<div class="caja-hum" id="caja-vencida"><div class="cab">${icono('banco', 'p')}La oferta venció sin respuesta</div><p class="peq">Venció el ${fecha(o.vence)}. Al renovarla, el cliente recibe la misma versión con 5 días más para aceptarla.</p><button class="btn vrd" style="margin-top:10px" data-a="renovar-oferta" id="btn-renovar-oferta">Renovar oferta (5 días más)</button></div>`
    if (o.estado === 'ajuste') {
      const sugerido = Math.max(o.ajuste.propuesta, redondear(o.porTxTarifa - 0.25))
      acciones = `<div class="caja-hum" id="caja-ajuste"><div class="cab">${icono('banco', 'p')}El cliente pidió un ajuste</div>
        <p class="peq">Propone <b>${q(o.ajuste.propuesta)}</b> por pago (tarifa ${q(o.porTxTarifa)}). «${esc(o.ajuste.motivo)}»</p>
        <div class="grid-2" style="margin-top:10px">${campo('Comisión a ofrecer (Q por pago)', `<input type="number" step="0.05" min="0" data-c="contraoferta" value="${ui.bo.contraoferta ?? sugerido}" class="num" id="in-contraoferta">`)}
          <div class="col" style="justify-content:flex-end"><label class="check"><input type="checkbox" data-c="jefatura" ${ui.bo.jefatura ? 'checked' : ''} id="chk-jefatura"><span class="peq">Excepción aprobada por la Jefatura Comercial (${JEFATURA_COMERCIAL})</span></label></div></div>
        <p class="mini mut" style="margin-top:6px">Por debajo de la tarifa es una excepción: el código exige la aprobación de la Jefatura.</p>
        <button class="btn vrd" style="margin-top:10px" data-a="responder-ajuste" id="btn-contraoferta">Enviar nueva oferta</button></div>`
    }
  } else if (exp.etapa === 4 && ['borrador', 'ajuste', 'vencida'].includes(o.estado)) {
    acciones = `<div class="bloqueado">${icono('candado', 'p')}Envía la oferta Comercial. Cambia «Ver como» a Comercial.</div>`
  }
  return `<div class="grid-2">
    <div class="caja-sis"><div class="cab">${icono('sistema', 'p')}Comisión calculada con el tarifario · sistema</div>
      ${[
        ['Tramo', `${o.tramo} (${num(s.volumen)} pagos al mes)`],
        ['Tarifa del tramo', `${q(o.porTxTarifa)} por pago`],

function estadosFirmaHTML(f) {
  const alcanzados = new Set(f.estados.map((x) => x.estado)), actual = estadoProveedor(f)
  const malo = (e) => ['rechazado', 'expirado', 'cancelado'].includes(e)
  // El actual se marca con flecha; un rechazo o vencimiento ya superado (hubo reenvío) queda en ámbar, no en verde.
  const clase = (e) => e === actual ? (malo(e) ? 'error' : e === 'firmado' ? 'ok' : 'osc') : alcanzados.has(e) ? (malo(e) ? 'aviso' : 'ok') : ''
  const ic = (e) => !alcanzados.has(e) ? '' : icono(e === actual ? 'flecha' : malo(e) ? 'alerta' : 'check', 'p')
  const lista = [...ESTADOS_FIRMA, ...(alcanzados.has('cancelado') ? ['cancelado'] : [])]
  return `<div class="fila" style="gap:6px;margin-top:10px" id="estados-firma">${lista.map((e) => `<span class="chip ${clase(e)}">${ic(e)}${e}</span>`).join('')}</div>`
}

function tabFirma(exp) {

      : `<div class="bloqueado">${icono('candado', 'p')}Firma el apoderado desde la vista de Legal.</div>`

    accion = legal
      ? `<div class="caja-hum" id="caja-excepcion-firma"><div class="cab">${icono('alerta', 'p')}${f.estado === 'rechazada' ? 'Firma rechazada' : 'Firma vencida'}</div><p class="peq">${porque} Decide cómo seguir.</p>
          <div class="decision"><button class="btn vrd chico" data-a="reenviar-firma" id="btn-reenviar">${icono('reinicio', 'p')}Reenviar enlace (${VIGENCIA_FIRMA_H} h)</button><button class="btn aviso chico" data-a="abrir-cancelar-firma" id="btn-cancelar-firma">Cancelar y volver a revisión</button></div></div>`
      : `<div class="bloqueado">${icono('candado', 'p')}${porque} Decide Legal: cambia «Ver como» a Legal.</div>`

  return `<div class="grid-2">
    <div class="col">

        <p class="mini mut" style="margin-top:8px">Legalización: por definir con Legal (H16). La demo solo simula la firma electrónica; si hace falta legalización notarial, sería un paso más de esta etapa.</p></div>
      ${accion}
      <div class="caja-sis"><div class="cab">${icono('sistema', 'p')}Evidencia e integridad · sistema</div>
        <p class="peq">Huella SHA-256 del convenio enviado:</p><p class="webhook" style="word-break:break-all;margin-top:4px">${f.hash}</p>
        <p class="peq" style="margin-top:8px">${f.integridad === true ? `<span class="chip ok">${icono('check', 'p')}La huella del firmado coincide</span>` : f.integridad === false ? '<span class="chip error">La huella no coincide</span>' : '<span class="chip">Se valida al completar las firmas</span>'}</p>

    return { nom: `${e.n}. ${e.nombre}`, v, meta, etq: `${dec1(v)} d`, tip: `${e.nombre}: ${dec1(v)} días · meta ${e.meta}${sobre ? ' · sobre la meta' : ''}` }

function coParametrizacion() {
  // El expediente elegido sigue visible al quedar listo (pasa a la etapa 8), para no saltar a otro sin aviso.
  const lista = db.expedientes.filter((e) => e.estado === 'en_curso' && (e.etapa === 7 || (e.etapa === 8 && e.id === ui.co.expId)))
  if (!ui.co.expId || !lista.some((e) => e.id === ui.co.expId)) ui.co.expId = lista.length ? (lista.find((e) => e.vivo) || lista[0]).id : null
  const exp = ui.co.expId ? buscarExp(ui.co.expId) : null
  const selector = `<div class="fila" style="gap:8px;margin-bottom:16px">${lista.map((e) => `<button class="chip ${e.id === ui.co.expId ? 'osc' : ''}" data-a="co-exp" data-v="${e.id}">${e.id} · ${esc(e.empresa.comercial)}</button>`).join('') || '<span class="mut peq">No hay expedientes en la etapa 7.</span>'}</div>`
  if (!exp) return `<div class="cab-pag"><div><h2>Parametrización y pruebas</h2><p>Etapa 7 del journey.</p></div></div>${selector}`
  const p = exp.param, d = p.datos
  const pasos = [['pendiente', 'Crear solicitud'], ['configurando', 'Configurar'], ['probando', 'Probar'], ['listo', 'Servicio listo']]
  const iActual = pasos.findIndex(([k]) => k === p.estado)
  let cuerpo = ''
  if (p.estado === 'pendiente') {
    cuerpo = `<div class="tarjeta"><h3>Convenio firmado y archivado</h3><p class="mut peq" style="margin-top:4px">Falta registrar el servicio en el core y probarlo antes de activarlo.</p>
      ${esOps() ? `<button class="btn" style="margin-top:14px" data-a="crear-param" id="btn-crear-param">Crear solicitud de parametrización</button>` : soloLectura('Operaciones')}</div>`
  } else if (p.estado === 'configurando') {
    const er = ui.co.erroresParam || {}
    const f = (k, etq) => campo(etq, `<input data-c="param-${k}" value="${esc(d[k])}" ${esOps() ? '' : 'readonly'}>`, '', er[k])
    cuerpo = `<div class="tarjeta" id="form-param"><h3>Configuración del convenio</h3><p class="mut peq" style="margin-top:4px">Precargada desde el expediente y el convenio firmado.</p>
      <div class="grid-2" style="margin-top:14px">${f('convenio', 'Código de convenio')}${f('cuenta', 'Cuenta de acreditación')}${f('referencia', 'Dato del pagador')}${f('validacion', 'Validación')}${f('canales', 'Canales')}${f('corte', 'Hora de corte')}${f('minimo', 'Monto mínimo (Q)')}${f('maximo', 'Monto máximo (Q)')}${f('reporte', 'Reporte diario')}</div>
      <div class="aviso-linea aviso" style="margin-top:14px">${icono('alerta')}<span>El core no tiene una API conocida para registrar convenios: en la demo se simula la carga manual (pregunta 5 para Banrural).</span></div>
      ${esOps() ? `<button class="btn" style="margin-top:14px" data-a="guardar-param" id="btn-guardar-param">Guardar en el core y preparar pruebas</button>` : soloLectura('Operaciones')}</div>`
  } else {
    const fallas = p.pruebas.filter((x) => x.estado === 'falla')
    const pend = p.pruebas.filter((x) => x.estado === 'pendiente').length
    cuerpo = `<div class="tarjeta" id="pruebas"><div class="fila-e"><h3>Pruebas de QA</h3>${p.estado === 'listo' ? `<span class="fila" style="gap:8px"><span class="chip ok">${icono('check', 'p')}Servicio listo</span><button class="btn chico" data-a="co-seccion" data-v="activacion">Ir a Activación ${icono('flecha', 'p')}</button></span>` : ''}</div>
      <div style="margin-top:8px">${p.pruebas.map((x) => `<div class="prueba"><span style="color:${x.estado === 'ok' ? 'var(--ok)' : x.estado === 'falla' ? 'var(--error)' : 'var(--texto-3)'}">${icono(x.estado === 'ok' ? 'check' : x.estado === 'falla' ? 'x' : 'reloj')}</span>
        <span>${x.nombre}${x.nota ? `<br><span class="mini ${x.estado === 'falla' ? '' : 'mut'}" style="${x.estado === 'falla' ? 'color:var(--error)' : ''}">${esc(x.nota)}</span>` : ''}</span>
        ${x.estado === 'falla' && esOps() ? `<button class="btn aviso chico" data-a="corregir-prueba" data-v="${x.id}" id="btn-corregir">Corregir</button>` : `<span class="chip ${x.estado === 'ok' ? 'ok' : x.estado === 'falla' ? 'error' : ''}">${{ ok: 'Bien', falla: 'Falla', pendiente: 'Pendiente' }[x.estado]}</span>`}</div>`).join('')}</div>
      ${p.estado !== 'listo' ? (esOps() ? `<button class="btn" style="margin-top:14px" data-a="ejecutar-pruebas" id="btn-pruebas" ${pend ? '' : 'disabled'}>${icono('play', 'p')}${fallas.length && !pend ? 'Corrige la falla para volver a probar' : `Ejecutar ${pend} prueba${pend === 1 ? '' : 's'}`}</button>` : soloLectura('Operaciones / QA')) : ''}</div>`
  }
  return `<div class="cab-pag"><div><h2>Parametrización y pruebas</h2><p>Etapa 7 · el journey no le pone actor ni tiempo («X días», hallazgo H17).</p></div></div>
    ${selector}
    <div class="tarjeta" style="margin-bottom:16px"><div class="fila-e"><div><span class="num mut neg">${exp.id}</span><h3 style="margin-top:2px">${esc(exp.empresa.razon)}</h3></div>${chipSemaforo(exp)}</div>

    ${cuerpo}`
}

let enPaso = false // mientras corre un paso, sus avisos no salen en pantalla (ver toast)

function ejecutarPaso(n, rapido) {
  const p = PASOS_GUIA[n]
  enPaso = true
  try { (rapido && p.rapido ? p.rapido : p.hacer)() } finally { enPaso = false }
}

function iniciarGuia(desde = 0) {
  detenerGuia()
  guia = { i: 0, jugando: true, timer: null }
  irAPasoGuia(Math.min(Math.max(0, Math.floor(desde) || 0), PASOS_GUIA.length - 1)) // ?paso=2.5 o ?paso=abc no rompen la presentación
}

function irAPasoGuia(n) {
  clearTimeout(guia.timer)
  silencio = true
  reiniciar()
  for (let k = 0; k < n; k++) ejecutarPaso(k, true)
  silencio = false
  guia.i = n
  ejecutarPaso(n, false)
  guia.modal = ui.modal // la ventana que abre el paso es de la presentación (ver alTecla y devolverFoco)
  refrescar()
  guia.huella = JSON.stringify(db)
  programarGuia()
}

function siguientePasoGuia() {
  if (!guia) return
  if (guia.i >= PASOS_GUIA.length - 1) { guia.jugando = false; return refrescar() }
  // Si la persona cambió algo con la presentación en pausa, el paso siguiente no se aplica encima:
  // se rehace la historia hasta ahí, como con «←».
  if (JSON.stringify(db) !== guia.huella) return irAPasoGuia(guia.i + 1)
  guia.i++
  ejecutarPaso(guia.i, false)
  guia.modal = ui.modal
  refrescar()
  guia.huella = JSON.stringify(db)
  programarGuia()
}

function anteriorPasoGuia() {
  if (guia && guia.i > 0) irAPasoGuia(guia.i - 1)
}

function programarGuia() {
  clearTimeout(guia.timer)
  if (!guia.jugando) return
  if (guia.i >= PASOS_GUIA.length - 1) { guia.jugando = false; return renderGuia() } // termina: el botón pasa a «empezar de nuevo»
  guia.timer = setTimeout(siguientePasoGuia, (PASOS_GUIA[guia.i].dur || 6500) / VEL)
}

function pausarGuia() { if (!guia) return; guia.jugando = false; clearTimeout(guia.timer); renderGuia() }
function reanudarGuia() { if (!guia) return; guia.jugando = true; programarGuia(); renderGuia() }
function detenerGuia() { if (guia) clearTimeout(guia.timer); guia = null }

const ACCIONES_GUIA = {
  'guia-ant': () => { pausarGuia(); anteriorPasoGuia() },
  'guia-sig': () => { pausarGuia(); siguientePasoGuia() },
  // En el último paso, ▶ vuelve a empezar la presentación.
  'guia-play': () => (guia.jugando ? pausarGuia() : guia.i >= PASOS_GUIA.length - 1 ? iniciarGuia(0) : reanudarGuia()),
  'guia-cerrar': () => { detenerGuia(); render() },
}

      ${guia.jugando ? `<button class="prim" data-g="guia-play" aria-label="Pausar">${icono('pausa', 'p')}</button>`
        : guia.i === total - 1 ? `<button class="prim" data-g="guia-play" aria-label="Empezar de nuevo" title="Empezar de nuevo">${icono('reinicio', 'p')}</button>`
        : `<button class="prim" data-g="guia-play" aria-label="Reproducir">${icono('play', 'p')}</button>`}
      <button data-g="guia-sig" aria-label="Paso siguiente" ${guia.i === total - 1 ? 'disabled' : ''}>${icono('adelante', 'p')}</button>
      <button data-g="guia-cerrar" aria-label="Cerrar la presentación">${icono('x', 'p')}</button>
    </div>
    <div class="g-prog"><i style="width:${((guia.i + 1) / total) * 100}%"></i></div>
  </div>`
}

function aplicarFoco() {
  document.querySelectorAll('.foco').forEach((x) => x.classList.remove('foco'))

  const f = PASOS_GUIA[guia.i].foco
  const sel = typeof f === 'function' ? f() : f

  const el = document.querySelector(sel)
  if (!el) return
  el.classList.add('foco')
  if (!el.closest('.modal')) el.scrollIntoView({ block: 'center', behavior: guia.jugando ? 'smooth' : 'auto' })

// ── Foco: render() reemplaza todo el HTML, así que se anota dónde estaba y se devuelve al mismo elemento ──
let ventanaDibujada = null // la ventana (ui.modal) de la última vez que se dibujó
let abridor = null // selector del elemento que abrió la ventana: al cerrarla, el foco vuelve ahí

function selectorDe(el) {
  if (!el || !el.closest || !el.closest('#app, #capa-modal')) return null
  const d = el.dataset || {}
  if (el.id) return `#${CSS.escape(el.id)}`
  if (d.c) return `[data-c="${CSS.escape(d.c)}"]${el.type === 'radio' ? `[value="${CSS.escape(el.value)}"]` : ''}`
  if (d.a) return `[data-a="${CSS.escape(d.a)}"]${d.v !== undefined ? `[data-v="${CSS.escape(d.v)}"]` : ''}`
  return null
}

function anotarFoco() {
  const el = document.activeElement, sel = selectorDe(el)
  if (!sel) return null
  let seleccion = null
  try { if (typeof el.selectionStart === 'number') seleccion = [el.selectionStart, el.selectionEnd] } catch (e) { /* tipo sin selección */ }
  return { sel, seleccion, enVentana: !!el.closest('#capa-modal') }
}

const enfocar = (el) => el.focus({ preventScroll: true })

function devolverFoco(foco) {
  if (ui.modal && ui.modal !== ventanaDibujada) {
    // Se abrió una ventana: el foco entra en ella. La que abre un paso de la presentación no lo toma,
    // para que quien presenta siga con ← y →.
    if (!ventanaDibujada) abridor = foco && !foco.enVentana ? foco.sel : null
    ventanaDibujada = ui.modal
    const m = document.querySelector('#capa-modal .modal')
    if (!m || (guia && ui.modal === guia.modal)) return
    const destino = m.querySelector('input:not([type=hidden]), textarea, select') || m.querySelector('#btn-modal-ok') || m.querySelector('button')
    if (destino) enfocar(destino)
    return
  }
  if (!ui.modal && ventanaDibujada) {
    ventanaDibujada = null
    const el = abridor && document.querySelector(abridor)
    abridor = null
    if (el) return enfocar(el)
  }
  const el = foco && document.querySelector(foco.sel)
  if (!el || el === document.activeElement) return
  enfocar(el)
  if (foco.seleccion) try { el.setSelectionRange(...foco.seleccion) } catch (e) { /* tipo sin selección */ }
}

// Con una ventana abierta, Tab y Shift+Tab giran dentro de ella.
function encerrarTab(e) {
  const m = document.querySelector('#capa-modal .modal')
  if (!m) return
  const lista = [...m.querySelectorAll('button, input, textarea, select, a[href], [tabindex]:not([tabindex="-1"])')].filter((x) => !x.disabled && x.offsetParent !== null)
  if (!lista.length) return
  const actual = document.activeElement, primero = lista[0], ultimo = lista.at(-1)
  if (!m.contains(actual) || (e.shiftKey ? actual === primero : actual === ultimo)) { e.preventDefault(); enfocar(e.shiftKey ? ultimo : primero) }
}

    if (!m.texto.trim()) { m.error = 'Explica qué necesitas y por qué.'; return }
    ui.modal = null
    pedirDocumento(expAbierto(), ui.rol, m.doc, m.texto.trim())
  },
  'aclarar-confirmar': () => {
    const m = ui.modal
    if (!m.texto.trim()) { m.error = 'Escribe cómo se aclaró la diferencia.'; return }
    ui.modal = null
    aclararInconsistencia(expAbierto(), m.id, m.texto.trim())
  },
  'decision-confirmar': () => {
    const m = ui.modal
    if (!m.texto.trim()) { m.error = m.decision === 'rechazado' ? 'El rechazo necesita un motivo.' : 'Escribe qué debe aclarar el cliente.'; return }
    ui.modal = null
    decidir(expAbierto(), m.area, m.decision, m.texto.trim())
  },
  'activar-confirmar': () => {
    const m = ui.modal, exp = buscarExp(m.expId)
    if (m.texto.trim().toUpperCase() !== String(exp.param.datos.convenio).trim().toUpperCase()) { m.error = `Escribe exactamente ${exp.param.datos.convenio} para confirmar.`; return }
    ui.modal = null
    activar(exp)
  },
}

function modalHTML() {
  const m = ui.modal, err = m.error ? `<div class="aviso-linea error" style="margin-top:10px">${icono('alerta')}<span>${esc(m.error)}</span></div>` : ''
  const pie = (accion, etq, clase = '') => `<div class="fila" style="justify-content:flex-end;margin-top:18px"><button class="btn sec" data-a="cerrar-modal">Cancelar</button><button class="btn ${clase}" data-a="${accion}" id="btn-modal-ok">${etq}</button></div>`
  let cuerpo = ''
  if (m.tipo === 'otp') {
    const exp = expVivo(), firmar = m.motivo === 'firmar'
    cuerpo = `<h3>${firmar ? 'Firmar el convenio' : 'Aceptar la oferta'}</h3>
      <p class="mut peq">${firmar ? `Vas a firmar el convenio ${exp.id} versión ${exp.convenio.version}.` : `Vas a aceptar la oferta versión ${exp.oferta.version}: ${q(exp.oferta.porTx)} por pago.`} Te enviamos un código de 6 dígitos por SMS al ${EMPRESA_VIVA.representante.telefono}.</p>
      ${firmar ? `<p class="mini mut" style="margin-top:6px">Huella del documento: <span class="webhook">${exp.firma.hash.slice(0, 24)}…</span></p>` : ''}
      <label class="campo" style="margin-top:14px"><span>Código</span><input class="num" inputmode="numeric" maxlength="6" data-c="m-codigo" value="${esc(m.codigo)}" style="font-size:22px;letter-spacing:.3em;font-weight:800" id="in-otp"></label>
      <button class="btn txt chico" data-a="otp-demo" style="margin-top:6px">Usar el código de esta demo (${OTP_DEMO})</button>
      ${err}${pie('otp-confirmar', firmar ? 'Verificar y firmar' : 'Verificar y aceptar', 'vrd')}`
  } else if (m.tipo === 'ajuste') {
    cuerpo = `<h3>Pedir un ajuste a la oferta</h3><p class="mut peq">Tu ejecutivo revisará la propuesta. Las excepciones las aprueba la Jefatura Comercial.</p>
      <div class="col" style="margin-top:14px">${campo('Comisión que propones (Q por pago)', `<input type="number" step="0.05" min="0" class="num" data-c="m-propuesta" value="${esc(m.propuesta)}">`)}
      ${campo('Motivo', `<textarea rows="3" data-c="m-motivo">${esc(m.motivo)}</textarea>`)}</div>${err}${pie('ajuste-enviar', 'Enviar solicitud de ajuste')}`
  } else if (m.tipo === 'ajusteConvenio') {
    cuerpo = `<h3>Pedir un ajuste al convenio</h3><p class="mut peq">Legal gestionará una nueva versión si aplica.</p>
      <div style="margin-top:14px">${campo('¿Qué necesitas cambiar?', `<textarea rows="3" data-c="m-texto">${esc(m.texto)}</textarea>`)}</div>${err}${pie('ajuste-convenio-enviar', 'Enviar a Legal')}`
  } else if (m.tipo === 'decision') {
    const rech = m.decision === 'rechazado'
    cuerpo = `<h3>${rech ? 'Rechazar' : 'Observar'} · ${ROLES[m.area].nombre}</h3>
      <p class="mut peq">${rech ? 'El expediente se cierra y el cliente recibe el motivo.' : 'El cliente recibe la observación en su portal. Al responder, el expediente vuelve solo a tu bandeja.'}</p>
      ${rech ? '' : chipsMotivos()}
      <div style="margin-top:14px">${campo(rech ? 'Motivo del rechazo' : 'Qué debe aclarar el cliente', `<textarea rows="3" data-c="m-texto">${esc(m.texto)}</textarea>`)}</div>${err}${pie('decision-confirmar', rech ? 'Rechazar expediente' : 'Enviar observación', rech ? 'peligro' : '')}`
  } else if (m.tipo === 'aclarar') {
    const i = expAbierto().inconsistencias.find((x) => x.id === m.id)
    cuerpo = `<h3>Aclarar la diferencia de ${esc(i.campo)}</h3><p class="mut peq">${esc(i.texto)}</p><p class="mini mut" style="margin-top:4px">Evidencia: ${esc(i.evidencia)}. Tu nota queda en la trazabilidad; después puedes aprobar.</p>
      <div style="margin-top:14px">${campo('Cómo se aclaró', `<textarea rows="3" data-c="m-texto" id="in-aclarar">${esc(m.texto)}</textarea>`)}</div>${err}${pie('aclarar-confirmar', 'Registrar la aclaración', 'vrd')}`
  } else if (m.tipo === 'pedirDoc') {
    const exp = expAbierto(), nuevo = !exp.docs.some((d) => d.tipo === m.doc)
    cuerpo = `<h3>${nuevo ? 'Pedir un documento adicional' : 'Pedir una nueva versión'}</h3>
      <p class="mut peq"><b>${DOC_TIPOS[m.doc].nombre}</b>. La empresa lo sube desde su portal; al subirlo, el expediente vuelve a tu bandeja. ${exp.etapa === 3 ? 'Tu evaluación queda como «observada» mientras tanto.' : ''}</p>
      ${chipsMotivos()}
      <div style="margin-top:14px">${campo('Qué necesitas y por qué', `<textarea rows="3" data-c="m-texto" id="in-pedir-doc">${esc(m.texto)}</textarea>`)}</div>${err}${pie('pedir-doc-confirmar', 'Pedir a la empresa')}`
  } else if (m.tipo === 'rechazoFirma') {
    cuerpo = `<h3>No firmar el convenio</h3><p class="mut peq">Legal recibe tu motivo y decide si te envía un enlace nuevo o una versión corregida del convenio.</p>
      <div style="margin-top:14px">${campo('¿Por qué no lo firmas?', `<textarea rows="3" data-c="m-texto" id="in-rechazo-firma">${esc(m.texto)}</textarea>`)}</div>${err}${pie('rechazo-firma-enviar', 'Enviar a Legal', 'peligro')}`
  } else if (m.tipo === 'cancelarFirma') {
    cuerpo = `<h3>Cancelar la solicitud de firma</h3><p class="mut peq">El enlace deja de servir y el convenio vuelve a Legal (etapa 5) para una versión nueva. La solicitud cancelada queda en la trazabilidad.</p>
      <div style="margin-top:14px">${campo('Motivo', `<textarea rows="3" data-c="m-texto">${esc(m.texto)}</textarea>`)}</div>${err}${pie('cancelar-firma-confirmar', 'Cancelar la solicitud', 'aviso')}`
  } else if (m.tipo === 'activar') {
    const exp = buscarExp(m.expId)
    cuerpo = `<h3>Pasar a producción</h3><p class="mut peq">${esc(exp.empresa.razon)} empezará a recibir pagos reales en toda la red. Esta acción no se deshace desde aquí.</p>
      <div style="margin-top:14px">${campo(`Escribe <b>${esc(exp.param.datos.convenio)}</b> para confirmar`, `<input data-c="m-texto" value="${esc(m.texto)}" class="num" autocomplete="off" id="in-activar">`)}</div>${err}${pie('activar-confirmar', 'Pasar a producción', 'vrd')}`
  }
  return `<div class="velo" data-a="cerrar-velo"><div class="modal" role="dialog" aria-modal="true">${cuerpo}</div></div>`
}

// Atajos con los motivos del catálogo (Consola · Catálogos).
const chipsMotivos = () => db.catalogos.motivos.length
  ? `<div class="fila" style="gap:6px;margin-top:12px"><span class="mini mut">Motivos frecuentes:</span>${db.catalogos.motivos.map((t) => `<button class="chip" data-a="usar-motivo" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>`
  : ''

function bajarArchivo({ nombre, texto }) {
  if (typeof Blob === 'undefined' || typeof URL === 'undefined' || !URL.createObjectURL) return toast('Este navegador no permite descargar el archivo.', 'error')
  const url = URL.createObjectURL(new Blob([texto], { type: 'text/plain;charset=utf-8' }))
  const a = document.createElement('a')
  a.href = url
  a.download = nombre
  document.body.appendChild(a)
  a.click()
  a.remove()
  setTimeout(() => URL.revokeObjectURL(url), 1000)
  toast(`Descargado: ${nombre}`)
}

// ── Eventos del documento ──────────────────────────────────────────────
// Seleccionar texto arrastrando y soltar fuera de la ventana no la cierra: la pulsación tiene que empezar en el velo.
let pulsoEnVelo = false
function alPulsar(e) { pulsoEnVelo = !!(e.target.classList && e.target.classList.contains('velo')) }

function alClic(e) {
  if (e.target.classList && e.target.classList.contains('velo')) {
    if (!pulsoEnVelo) return
    ui.modal = null
    return refrescar()
  }
  const el = e.target.closest('[data-a]')
  if (!el || el.disabled || el.dataset.a === 'cerrar-velo') return
  const accion = ACCIONES[el.dataset.a]
  if (!accion) return
  if (guia && guia.jugando && !['guia', 'reiniciar'].includes(el.dataset.a)) pausarGuia()
  accion(el)
  refrescar()
}

// Valor de un campo de configuración antes de editarlo: al confirmar (evento change) se anota solo si cambió.
let antesDeEditar = {}
const valorConfig = (c) => c.startsWith('sla-') ? db.sla[c.slice(4)]
  : c.startsWith('tarifa-') ? db.tarifario[Number(c.slice(7))].porTx
  : c.startsWith('riesgo-clase-') ? db.riesgo.clase[c.slice(13)]
  : c === 'riesgo-bajo' ? db.riesgo.bajo : c === 'riesgo-medio' ? db.riesgo.medio : undefined

// La regla de cada campo de configuración: si el valor no la cumple, no se guarda y al confirmar se dice por qué.
const reglaConfig = (c) => c.startsWith('sla-') ? [(v) => v > 0, 'El SLA debe ser mayor que 0 días.']
  : c.startsWith('tarifa-') ? [(v) => v > 0, 'La tarifa debe ser mayor que Q0.']
  : c.startsWith('riesgo-clase-') ? [(v) => Number.isInteger(v) && v >= 1 && v <= 5, 'Los puntos por actividad son un número entero del 1 al 5.']
  : c === 'riesgo-bajo' ? [(v) => Number.isInteger(v) && v >= 6 && v < db.riesgo.medio, `«Bajo hasta» es un número entero del 6 al ${db.riesgo.medio - 1}: tiene que ser menor que «Medio hasta».`]
  : c === 'riesgo-medio' ? [(v) => Number.isInteger(v) && v > db.riesgo.bajo && v <= 30, `«Medio hasta» es un número entero del ${db.riesgo.bajo + 1} al 30: tiene que ser mayor que «Bajo hasta».`]
  : null

function fijarConfig(c, v) {
  if (c.startsWith('sla-')) db.sla[c.slice(4)] = v
  else if (c.startsWith('tarifa-')) db.tarifario[Number(c.slice(7))].porTx = v
  else if (c.startsWith('riesgo-clase-')) db.riesgo.clase[c.slice(13)] = v
  else if (c === 'riesgo-bajo') db.riesgo.bajo = v
  else if (c === 'riesgo-medio') db.riesgo.medio = v
}

function anotarCampoConfig(c) {
  const antes = antesDeEditar[c], ahora = valorConfig(c)
  delete antesDeEditar[c]
  if (antes === undefined || antes === ahora) return
  if (c.startsWith('sla-')) {
    anotarCambio('reglas', `SLA de la etapa ${c.slice(4)}: ${dec1(antes)} → ${dec1(ahora)} días`)
    revisarSeguimiento(db.reloj) // lo que vence con la regla nueva se detecta en el acto, con sus eventos
  }
  else if (c.startsWith('tarifa-')) anotarCambio('reglas', `Tarifa del tramo ${db.tarifario[Number(c.slice(7))].tramo}: ${q(antes)} → ${q(ahora)} por pago`)
  else if (c.startsWith('riesgo-clase-')) nuevaVersionRiesgo(`actividad ${CLASE_TXT[c.slice(13)]}: ${antes} → ${ahora} pt`)
  else nuevaVersionRiesgo(`nivel ${c === 'riesgo-bajo' ? 'bajo' : 'medio'} hasta ${antes} → ${ahora} puntos`)
}

function asignarCampo(el) {
  const c = el.dataset.c, val = el.type === 'checkbox' ? el.checked : el.value
  if (valorConfig(c) !== undefined && !(c in antesDeEditar)) antesDeEditar[c] = valorConfig(c)
  // La ventana pudo cerrarse antes de que llegue el último evento del campo (por ejemplo, con Escape).
  if (c.startsWith('m-')) { if (ui.modal) ui.modal[c.slice(2)] = val; return false }
  const regla = reglaConfig(c)
  if (regla) { if (regla[0](Number(val))) fijarConfig(c, Number(val)); return false }
  if (c.startsWith('cat-doc-')) { const [t, k] = c.slice(8).split('-'); const r = cambiarDocRequerido(t, k, !!val); if (r.error) toast(r.error, 'error'); return true }
  if (c.startsWith('usr-rol-')) { cambiarUsuario(Number(c.slice(8)), { rol: val }); return true }
  if (c === 'co-motivo') { ui.co.motivo = val; return false }
  if (c.startsWith('nu-')) { ui.co.nuevoUsuario = { ...(ui.co.nuevoUsuario || { nombre: '', rol: 'comercial' }), [c.slice(3)]: val }; return false }
  if (c === 'pl-legal') { if (ui.co.plantilla) ui.co.plantilla.legal = val; return false }
  if (c.startsWith('pl-')) { if (ui.co.plantilla) ui.co.plantilla.fijas[c.slice(3)] = val; return false }
  if (c.startsWith('param-')) { buscarExp(ui.co.expId).param.datos[c.slice(6)] = val; if (ui.co.erroresParam) delete ui.co.erroresParam[c.slice(6)]; return false }
  if (c.startsWith('resp-')) { ui.respuestas = { ...(ui.respuestas || {}), [c.slice(5)]: val }; return false }
  if (c === 'contraoferta') { ui.bo.contraoferta = val; return false }
  if (c.startsWith('cv-')) {
    const cv = ui.bo.cv && ui.bo.cv.exp === ui.bo.expId ? ui.bo.cv : { exp: ui.bo.expId }, k = c.slice(3)
    ui.bo.cv = { ...cv, [k]: val, err: { ...(cv.err || {}), [k]: '' } }
    return false
  }
  if (c === 'nit') return ui.portal.borrador ? cambiarNit(val) : false
  if (c === 'jefatura') { ui.bo.jefatura = val; return false }
  const b = ui.portal.borrador
  if (b && c in b) {
    b[c] = val
    if (ui.portal.errores && ui.portal.errores[c]) delete ui.portal.errores[c]
    return el.type === 'checkbox' || el.type === 'radio'
  }
  return false
}

function alEntrada(e) {
  const el = e.target
  if (el.id === 'sel-rol' || !el.dataset || !el.dataset.c) return
  if (asignarCampo(el) && el.dataset.c === 'nit') return refrescar() // otro NIT: se borra la consulta anterior en el acto
  guardar()
}

function alCambio(e) {
  const el = e.target
  if (el.id === 'sel-rol') {
    if (guia && guia.jugando) pausarGuia()
    cambiarRol(el.value)
    return refrescar()
  }
  if (!el.dataset || !el.dataset.c) return
  const refresca = asignarCampo(el)
  if (valorConfig(el.dataset.c) !== undefined) { // se ve el valor aceptado, el historial y, si no se aceptó, por qué
    if (!reglaConfig(el.dataset.c)[0](Number(el.value))) toast(reglaConfig(el.dataset.c)[1], 'error')
    anotarCampoConfig(el.dataset.c)
    return refrescar()
  }
  if (refresca) refrescar()
  else guardar()
}

function alTecla(e) {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.c === 'nit') { consultarMIS(e.target.value); return refrescar() }
  if (e.key === 'Tab' && ui.modal) return encerrarTab(e)
  if (e.key === 'Escape' && ui.modal) { ui.modal = null; return refrescar() }
  if (e.key === 'Escape' && guia) { detenerGuia(); return render() }
  // Con una ventana que abrió la persona, las teclas no mueven la presentación que está detrás.
  if (!guia || (ui.modal && ui.modal !== guia.modal) || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return
  if (e.key === 'ArrowRight') { pausarGuia(); siguientePasoGuia() }
  if (e.key === 'ArrowLeft') { pausarGuia(); anteriorPasoGuia() }
  if (e.key === ' ') { e.preventDefault(); guia.jugando ? pausarGuia() : reanudarGuia() }
}

// ── Avisos flotantes y tooltips ────────────────────────────────────────
function toast(texto, tipo = '') {
  // Los avisos de los pasos de la presentación ya se ven en «Avisos que te enviamos». Los de quien presenta
  // (con la presentación en pausa o terminada) sí salen, y los de error siempre.
  if (silencio || (tipo !== 'error' && (enPaso || (guia && guia.jugando)))) return
  const cont = document.getElementById('avisos')
  const el = document.createElement('div')
  el.className = `avisito ${tipo}`
  el.innerHTML = `${icono(tipo === 'error' ? 'alerta' : tipo === 'ia' ? 'chispa' : tipo === 'sis' ? 'correo' : 'check', 'p')}<span>${esc(texto)}</span>`
  cont.appendChild(el)
  while (cont.children.length > 3) cont.firstChild.remove()
  setTimeout(() => el.remove(), 4200)
}

function alPasarMouse(e) {
  const tip = document.getElementById('tip')
  const el = e.target.closest && e.target.closest('[data-tip]')
  if (!el) return tip.classList.add('oculto')
  tip.textContent = el.dataset.tip
  tip.classList.remove('oculto')
  const r = el.getBoundingClientRect()
  tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px'
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px'
}

// Una recarga corta el temporizador del Agente 1: el análisis se termina con el resultado que iba a dar.
function terminarAnalisis() {
  const b = ui.portal.borrador
  for (const nombre of Object.keys((b && b.analizando) || {})) { subirArchivo(nombre, false); delete b.analizando[nombre] }
}

function arrancar() {
  const qs = new URLSearchParams(location.search), rol = qs.get('rol')
  const abrir = () => {
    if (rol && Object.hasOwn(ROLES, rol)) cambiarRol(rol) // Object.hasOwn: «constructor» no es un rol
    ui.portal.validando = false
    terminarAnalisis()
    const v = expVivo()
    if (v && v.etapa === 2 && v.estado === 'en_curso' && !v.eventos.some((x) => x.accion.startsWith('Validó campos'))) validar(v) // validación cortada por una recarga
    render()
  }
  cargar()
  if (qs.get('reiniciar')) reiniciar()
  try { abrir() } catch (err) {
    // El estado guardado pasó la revisión pero no se puede dibujar: se empieza de cero en vez de dejar la página en blanco.
    reiniciar()
    abrir()
    toast('La demo guardada no se pudo abrir: empezó de cero.', 'error')
  }
  guardar() // después de dibujar bien
  document.addEventListener('pointerdown', alPulsar)
  document.addEventListener('click', alClic)
  document.addEventListener('input', alEntrada)
  document.addEventListener('change', alCambio)
  document.addEventListener('keydown', alTecla)
  document.addEventListener('mouseover', alPasarMouse)
  window.addEventListener('scroll', () => document.getElementById('tip').classList.add('oculto'), { passive: true })
  if (qs.get('demo')) iniciarGuia(Math.max(0, (Number(qs.get('paso')) || 1) - 1)) // ?paso=1 es el primero
}

document.addEventListener('DOMContentLoaded', arrancar)

</script>
