function enviarSolicitud() {
  const b = ui.portal.borrador, e = b.empresa
  const cuenta = e.cuentas.find((c) => c.numero === b.cuenta) || e.cuentas[0]
  const exp = {
    id: idTexto(db.secuencia++), vivo: true,
    empresa: { ...e, representante: { ...e.representante } },
    servicio: {
      modalidad: b.modalidad, volumen: Number(b.volumen), monto: Number(b.monto), cheques: b.cheques, bancaVirtual: b.bancaVirtual,
      acreditacion: b.acreditacion, cuenta: `${cuenta.tipo} ${cuenta.numero}`, refNombre: b.refNombre, refLargo: Number(b.refLargo), refTipo: b.refTipo,
      reporteFormato: b.reporteFormato, reporteCorreo: b.reporteCorreo, contacto: { nombre: b.contactoNombre, correo: b.contactoCorreo, tel: b.contactoTel },
    },
    pep: b.pep === 'si' ? 'si' : 'no',
    asesor: persona('asesor'), creadoPor: ui.rol,
    etapa: 1, estado: 'en_curso', enEtapaDesde: db.reloj, creado: db.reloj,
    docs: docsRequeridos().map((t) => (b.docs[t] && b.docs[t].estado === 'listo'
      ? { tipo: t, ...b.docs[t], estado: 'listo', version: 1, historial: [], t: db.reloj }
      : { tipo: t, archivo: null, estado: 'faltante', campos: null, version: 0, historial: [] })),
    hallazgos: [], obs: [], eventos: [], avisos: [], ia: {},
    evaluacion: null, riesgo: null, oferta: null, convenio: null, firma: null, param: null, activacion: null,
  }
  const anterior = expVivo()
  if (anterior) anterior.vivo = false // ya cerrada (rechazada o activa): queda de consulta
  db.expedientes.unshift(exp)
  db.vivoId = exp.id
  const quien = ui.rol === 'asesor' ? `${persona('asesor')} (asesor)` : e.representante.nombre
  const cargados = exp.docs.filter((d) => d.archivo)
  evento(exp, 'cli', quien, 'Envió la solicitud', `${MODALIDADES[b.modalidad].nombre} · ${cargados.length} de ${exp.docs.length} documentos · PEP: ${exp.pep === 'si' ? 'sí' : 'no'}`, true)
  // La clasificación ocurrió al subir cada archivo; aquí queda asociada al expediente (§6: trazabilidad de cada recomendación).
  const porIA = cargados.filter((d) => d.clasif && d.clasif.por === 'ia'), aMano = cargados.filter((d) => !(d.clasif && d.clasif.por === 'ia'))
  if (porIA.length) evento(exp, 'ia', `Agente 1 · ${AGENTES[1].nombre}`, `Clasificó ${porIA.length} archivo${porIA.length === 1 ? '' : 's'} y extrajo sus datos`, porIA.map((d) => `${d.archivo} → ${DOC_TIPOS[d.tipo].nombre} (${Math.round(d.clasif.confianza * 100)} %)`).join(' · '))
  if (aMano.length) evento(exp, 'hum', 'Revisión manual (Agente 1 en pausa)', `Clasificó ${aMano.length} archivo${aMano.length === 1 ? '' : 's'} a mano`, aMano.map((d) => d.archivo).join(' · '))
  for (const n of b.noRequeridos || []) {
    if (n.confianza == null) evento(exp, 'hum', 'Revisión manual (Agente 1 en pausa)', 'Separó un archivo que no se pide', `${n.archivo} → ${DOC_TIPOS[n.tipo].nombre}`)
    else evento(exp, 'ia', `Agente 1 · ${AGENTES[1].nombre}`, 'Reconoció un archivo que no se pide y no lo adjuntó', `${n.archivo} → ${DOC_TIPOS[n.tipo].nombre}`)
  }
  avanzar(1)
  evento(exp, 'sis', 'Sistema', 'Generó el número de solicitud y el expediente digital', exp.id, true)
  aviso(exp, 'Correo', `Recibimos tu solicitud ${exp.id}.`)
  avanzar(2)
  pasarEtapa(exp, 2)
  evento(exp, 'sis', 'Sistema', 'Expediente digital creado: pasa a Validación automática')
  return exp
}

// ── Etapa 2: validación automática ─────────────────────────────────────
function validar(exp) {
  avanzar(18)
  evento(exp, 'sis', 'Sistema', 'Validó campos obligatorios y formatos', 'NIT, correos, teléfonos y montos sin errores')
  const ia = quienIA(1)
  const hallazgos = []
  // ¿Están todos? Contar contra la lista del tipo de empresa es aritmética: lo hace el código, con la clasificación del agente.
  const faltan = exp.docs.filter((d) => !d.archivo)
  evento(exp, 'sis', 'Sistema', 'Validó que los documentos estén completos', faltan.length
    ? `${exp.docs.length - faltan.length} de ${exp.docs.length}. Faltan: ${faltan.map((d) => DOC_TIPOS[d.tipo].nombre).join(', ')}`
    : `${exp.docs.length} de ${exp.docs.length}`)
  for (const d of faltan) hallazgos.push({ nivel: 'bloqueante', origen: 'sis', doc: d.tipo, pag: null, texto: `${DOC_TIPOS[d.tipo].nombre}: no está en la solicitud.` })
  const diferencia = exp.docs.some((d) => d.tipo === 'patente_sociedad' && d.archivo)
  if (diferencia) {
    hallazgos.push({ nivel: 'info', origen: 'ia', doc: 'patente_sociedad', pag: 1, texto: 'La Patente de Sociedad dice «Sociedad Anónima» y el formulario «S.A.»: son equivalentes, no requiere acción.' })
  }
  // El agente compara lo extraído con MIS (simulado: el agente real decide si dos domicilios son el mismo). Lo que no
  // coincide no lo resuelve él ni bloquea: queda abierto para que lo aclare Cumplimiento antes de aprobar.
  const domRTU = ((exp.docs.find((d) => d.tipo === 'rtu' && d.archivo) || {}).campos || {})['Domicilio fiscal']
  exp.inconsistencias = exp.inconsistencias || []
  if (domRTU && exp.empresa.domicilio && domRTU !== exp.empresa.domicilio && !exp.inconsistencias.some((i) => i.campo === 'domicilio')) {
    exp.inconsistencias.push({ id: 'i' + (exp.inconsistencias.length + 1), campo: 'domicilio', t: db.reloj, estado: 'abierta', evidencia: `${DOC_TIPOS.rtu.nombre}, pág. 1 · MIS`,
      texto: `El domicilio del RTU («${domRTU}») no coincide con el de MIS («${exp.empresa.domicilio}»).` })
  }
  const abiertas = incAbiertas(exp)
  for (const i of abiertas) hallazgos.push({ nivel: 'aviso', origen: 'ia', doc: 'rtu', pag: 1, inc: i.id, texto: `${i.texto} Lo aclara Cumplimiento antes de aprobar.` })
  const comp = [diferencia && '1 diferencia menor sin acción', abiertas.length && `${abiertas.length} ${abiertas.length === 1 ? 'inconsistencia' : 'inconsistencias'} para Cumplimiento (${abiertas.map((i) => i.campo).join(', ')})`].filter(Boolean)
  evento(exp, ia.actor, ia.quien, 'Comparó los documentos contra el formulario', `Extrajo fechas de vigencia; ${comp.length ? comp.join('; ') : 'sin diferencias'}`)
  avanzar(1)
  for (const d of exp.docs) {
    if (!d.vence || !d.archivo) continue
    const dias = diasHasta(d.vence)
    const nombre = DOC_TIPOS[d.tipo].nombre
    d.estado = 'listo'
    if (dias < 0) {
      d.estado = 'hallazgo'
      hallazgos.push({ nivel: 'bloqueante', origen: 'sis', doc: d.tipo, pag: d.pag, texto: `${nombre}: venció el ${isoAFecha(d.vence)}, hace ${-dias} días.`, calculo: `${isoAFecha(d.vence)} → ${fecha(db.reloj)} = ${dias} días` })
    } else if (dias <= 90) {
      hallazgos.push({ nivel: 'aviso', origen: 'sis', doc: d.tipo, pag: d.pag, texto: `${nombre}: vence en ${dias} días (${isoAFecha(d.vence)}).` })
    }
  }
  exp.hallazgos = hallazgos
  const bloq = hallazgos.filter((h) => h.nivel === 'bloqueante')
  evento(exp, 'sis', 'Sistema', 'Calculó las vigencias de los documentos', bloq.length ? bloq.map((h) => h.texto).join(' ') : 'Todos vigentes')
  if (bloq.length) {
    exp.estado = 'observado'
    for (const h of bloq) {
      if (exp.obs.some((o) => o.doc === h.doc && o.estado === 'abierta')) continue
      const falta = faltan.some((d) => d.tipo === h.doc)
      exp.obs.push({ id: 'o' + (exp.obs.length + 1), area: 'validacion', tipo: 'documento', doc: h.doc, texto: falta ? `${h.texto} Súbelo para continuar.` : `${h.texto} Sube el documento vigente, inscrito en el Registro Mercantil.`, estado: 'abierta', t: db.reloj })
    }
    evento(exp, 'sis', 'Sistema', '¿Información completa? No: devolvió la solicitud al cliente', `${bloq.length} ${bloq.length === 1 ? 'observación' : 'observaciones'} por resolver`, true)
    aviso(exp, 'Correo y SMS', `Tu solicitud ${exp.id} tiene ${bloq.length} ${bloq.length === 1 ? 'observación' : 'observaciones'} por resolver.`)
    return
  }
  exp.estado = 'en_curso'
  evento(exp, 'sis', 'Sistema', '¿Información completa? Sí: habilitó el envío a evaluación', '', true)
  avanzar(25)
  pasarEtapa(exp, 3)
  iniciarEvaluacion(exp)
}

function subsanarDocumento(exp, obsId) {
  const o = exp.obs.find((x) => x.id === obsId && x.estado === 'abierta')
  if (!o || !o.doc) return
  let d = exp.docs.find((x) => x.tipo === o.doc)
  if (!d) { d = { tipo: o.doc, archivo: null, estado: 'faltante', campos: null, version: 0, historial: [], adicional: true }; exp.docs.push(d) }
  avanzar(4 * 60)
  const eraFaltante = !d.archivo
  if (!eraFaltante) (d.historial = d.historial || []).push({ version: d.version || 1, archivo: d.archivo, t: d.t || exp.creado })
  // En la demo solo el nombramiento tiene una versión corregida; otro documento se vuelve a cargar con los datos de ejemplo.
  const nuevo = d.tipo === 'nombramiento' ? NOMBRAMIENTO_NUEVO : EXTRACCION_VIVO[d.tipo]
  const archivo = d.tipo === 'nombramiento' ? 'nombramiento_rep_legal_2026.pdf' : archivoDe(d.tipo).archivo
  Object.assign(d, { archivo, campos: nuevo.campos, vence: nuevo.vence || null, pag: nuevo.pag, estado: 'listo', version: (d.version || 0) + 1, t: db.reloj, revisado: null })
  evento(exp, 'cli', quienCliente(exp), eraFaltante ? 'Subió el documento que faltaba' : 'Subió el documento corregido', `${DOC_TIPOS[d.tipo].nombre} (versión ${d.version})`, true)
  const ia = quienIA(1)
  d.clasif = ia.actor === 'ia' ? { confianza: archivoDe(d.tipo).confianza, por: 'ia' } : { confianza: null, por: 'hum' }
  if (ia.actor !== 'ia') d.campos = null // sin el agente no hay extracción: los datos los revisa una persona
  avanzar(1)
  evento(exp, ia.actor, ia.quien, 'Clasificó y extrajo el documento nuevo', d.vence ? `Vigente hasta ${isoAFecha(d.vence)}` : DOC_TIPOS[d.tipo].nombre)
  o.estado = 'resuelta'
  o.resuelta = db.reloj
  exp.hallazgos = exp.hallazgos.filter((h) => !(h.doc === d.tipo && h.nivel === 'bloqueante'))
  if (o.area === 'validacion') {
    if (exp.obs.every((x) => x.estado === 'resuelta')) validar(exp)
    return
  }
  // Lo pidió un área: vuelve solo a esa área, como al responder una observación.
  if (exp.evaluacion && exp.evaluacion[o.area]) exp.evaluacion[o.area] = { estado: 'pendiente' }
  if (exp.obs.every((x) => x.estado === 'resuelta')) exp.estado = 'en_curso'
  if (exp.etapa === 3 && exp.ia.cumplimiento) actualizarCumplimiento(exp, d)
}

// Un documento nuevo en la evaluación cambia lo que el Agente 2 puede afirmar. Si llegaron los beneficiarios finales,
// el sistema los consulta en las listas de control; después el agente rehace su resumen. Decide Cumplimiento.
function actualizarCumplimiento(exp, d) {
  if (d.tipo === 'beneficiarios') consultarListas(exp)
  avanzar(2)
  const a2 = quienIA(2)
  exp.ia.cumplimiento = { ...resumenCumplimiento(exp), por: a2 }
  evento(exp, a2.actor, a2.quien, 'Actualizó resumen, checklist y borrador del informe', `Con ${minuscula(DOC_TIPOS[d.tipo].nombre)} (versión ${d.version}) · decide Cumplimiento`)
}

// ── Backoffice: gestión de documentos ──────────────────────────────────
const AREAS_DOCS = { 3: ['comercial', 'riesgos', 'cumplimiento'], 5: ['legal'] }
const puedePedirDocs = (exp, rol) => ['en_curso', 'observado'].includes(exp.estado) && (AREAS_DOCS[exp.etapa] || []).includes(rol)
  && !(exp.etapa === 3 && exp.evaluacion && exp.evaluacion[rol] && exp.evaluacion[rol].estado !== 'pendiente')
  && !(exp.etapa === 5 && !['revision_legal', 'ajuste_cliente'].includes(exp.convenio.estado)) // en revisión del cliente, Legal no tiene nada que decidir
const puedeRevisarDocs = (exp, rol) => ['comercial', 'riesgos', 'cumplimiento', 'legal'].includes(rol) && [3, 4, 5].includes(exp.etapa) && ['en_curso', 'observado'].includes(exp.estado)

function pedirDocumento(exp, area, tipo, motivo) {
  avanzar(20)
  const adicional = !exp.docs.some((d) => d.tipo === tipo)
  if (adicional) exp.docs.push({ tipo, archivo: null, estado: 'faltante', campos: null, version: 0, historial: [], adicional: true })
  const nombre = DOC_TIPOS[tipo].nombre
  exp.obs.push({ id: 'o' + (exp.obs.length + 1), area, tipo: 'documento', doc: tipo, texto: `Necesitamos ${adicional ? 'este documento' : 'una nueva versión'}: ${nombre}. ${motivo}`, estado: 'abierta', t: db.reloj })
  exp.estado = 'observado'
  if (exp.etapa === 3 && exp.evaluacion && exp.evaluacion[area]) exp.evaluacion[area] = { estado: 'observado', por: persona(area), t: db.reloj, comentario: `Pidió ${minuscula(nombre)}` }
  evento(exp, 'hum', `${persona(area)} · ${ROLES[area].nombre}`, adicional ? 'Pidió un documento adicional' : 'Pidió una nueva versión de un documento', `${nombre}. ${motivo}`, true)
  aviso(exp, 'Correo y SMS', `${ROLES[area].nombre} necesita un documento para continuar con tu solicitud.`)
}

function marcarRevisado(exp, rol, tipo) {
  const d = exp.docs.find((x) => x.tipo === tipo)
  if (!d || !d.archivo) return
  avanzar(10)
  d.revisado = { por: persona(rol), area: ROLES[rol].nombre, t: db.reloj }
  evento(exp, 'hum', `${persona(rol)} · ${ROLES[rol].nombre}`, 'Revisó un documento', `${DOC_TIPOS[tipo].nombre} (versión ${d.version || 1})`)
}

// ── Etapa 3: evaluación en paralelo ────────────────────────────────────
function iniciarEvaluacion(exp) {
  exp.evaluacion = { comercial: { estado: 'pendiente' }, riesgos: { estado: 'pendiente' }, cumplimiento: { estado: 'pendiente' } }
  evento(exp, 'sis', 'Sistema', 'Distribuyó el expediente en paralelo', 'Comercial, Riesgos y Cumplimiento', true)
  exp.riesgo = calcularRiesgo(exp)
  evento(exp, 'sis', 'Sistema', `Calculó la matriz de riesgo: ${exp.riesgo.nivel} (${exp.riesgo.puntos} puntos)`, exp.riesgo.version)
  consultarListas(exp)
  avanzar(2)
  const a2 = quienIA(2)
  exp.ia.cumplimiento = { ...resumenCumplimiento(exp), por: a2 }
  evento(exp, a2.actor, a2.quien, 'Preparó resumen, checklist y borrador del informe', 'Decide Cumplimiento')
  const a3 = quienIA(3)
  exp.ia.comercial = { ...resumenComercial(exp), por: a3 }
  evento(exp, a3.actor, a3.quien, 'Preparó el resumen comercial', 'Decide Comercial')
  aviso(exp, 'Correo', 'Tu solicitud está en evaluación.')
}

// La consulta a listas de control la hace el sistema, nunca el agente. La caja de Cumplimiento muestra la última.
function consultarListas(exp) {
  const bf = exp.docs.some((d) => d.tipo === 'beneficiarios' && d.archivo)
  evento(exp, 'sis', 'Sistema', 'Consultó listas de control', bf ? 'Sin coincidencias para la empresa, el representante y los beneficiarios finales' : 'Sin coincidencias para la empresa y el representante (beneficiarios finales: no declarados)')
}

const incAbiertas = (exp) => (exp.inconsistencias || []).filter((i) => i.estado === 'abierta')

// Cumplimiento aclara una inconsistencia que encontró el Agente 1. Es una decisión de una persona y queda con su nota.
function aclararInconsistencia(exp, id, nota) {
  const inc = (exp.inconsistencias || []).find((i) => i.id === id)
  if (!inc || inc.estado !== 'abierta' || !String(nota || '').trim()) return
  avanzar(15)
  Object.assign(inc, { estado: 'aclarada', nota: String(nota).trim(), por: persona('cumplimiento'), aclarada: db.reloj })
  evento(exp, 'hum', `${persona('cumplimiento')} · ${ROLES.cumplimiento.nombre}`, `Aclaró la diferencia de ${inc.campo}`, inc.nota)
}

function decidir(exp, area, decision, comentario = '') {
  // Solo decide un área pendiente de un expediente en evaluación: no se decide dos veces ni sobre uno cerrado.
  if (exp.etapa !== 3 || !['en_curso', 'observado'].includes(exp.estado) || !exp.evaluacion || exp.evaluacion[area].estado !== 'pendiente') return
  // Con una inconsistencia abierta, Cumplimiento no aprueba: primero la aclara. Observar o rechazar sí puede.
  if (area === 'cumplimiento' && decision === 'aprobado' && incAbiertas(exp).length) return
  avanzar(area === 'comercial' ? 40 : area === 'riesgos' ? 60 : 90)
  exp.evaluacion[area] = { estado: decision, por: persona(area), t: db.reloj, comentario }
  const verbo = { aprobado: 'Aprobó', observado: 'Observó', rechazado: 'Rechazó' }[decision]
  evento(exp, 'hum', `${persona(area)} · ${ROLES[area].nombre}`, `${verbo} la evaluación de ${ROLES[area].nombre}`, comentario, decision !== 'aprobado')
  if (decision === 'rechazado') {
    exp.estado = 'rechazado'
    evento(exp, 'sis', 'Sistema', 'Cerró el expediente como rechazado y avisó al cliente', comentario, true)
    aviso(exp, 'Correo', `Tu solicitud ${exp.id} no fue aprobada. Tu asesor te contactará.`)
    return
  }
  if (decision === 'observado') {
    exp.estado = 'observado'
    exp.obs.push({ id: 'o' + (exp.obs.length + 1), area, tipo: 'aclaracion', texto: comentario, estado: 'abierta', t: db.reloj })
    aviso(exp, 'Correo y SMS', `${ROLES[area].nombre} necesita una aclaración sobre tu solicitud.`)
    return
  }
  const ev = exp.evaluacion
  if (['comercial', 'riesgos', 'cumplimiento'].every((a) => ev[a].estado === 'aprobado')) {
    avanzar(5)
    evento(exp, 'sis', 'Sistema', 'Consolidó la evaluación final', 'Comercial, Riesgos y Cumplimiento aprobaron', true)
    pasarEtapa(exp, 4)
    prepararOferta(exp)
  }
}

function responderObservacion(exp, obsId, texto) {
  const o = exp.obs.find((x) => x.id === obsId)
  avanzar(5 * 60)
  o.estado = 'resuelta'
  o.respuesta = texto
  o.resuelta = db.reloj
  evento(exp, 'cli', quienCliente(exp), 'Respondió la observación', texto, true)
  if (exp.evaluacion && exp.evaluacion[o.area]) exp.evaluacion[o.area] = { estado: 'pendiente' } // vuelve solo al área que observó
  if (exp.obs.every((x) => x.estado === 'resuelta')) exp.estado = 'en_curso'
}

// ── Etapa 4: oferta y aceptación ───────────────────────────────────────
function prepararOferta(exp) {
  const c = calcularComision(exp)
  exp.oferta = { version: 1, estado: 'borrador', ...c, acreditacion: exp.servicio.acreditacion, vence: db.reloj + 5 * DIA, historial: [], excepcion: false }
  evento(exp, 'sis', 'Sistema', `Calculó la comisión con el tarifario: tramo ${c.tramo}`, `${num(exp.servicio.volumen)} pagos × ${q(c.porTx)} = ${q(c.bruto)} al mes`)
  const a3 = quienIA(3)
  exp.oferta.texto = textoOferta(exp)
  exp.oferta.textoPor = a3
  evento(exp, a3.actor, a3.quien, 'Redactó el borrador de la oferta', 'Lo revisa y envía Comercial')
}

function enviarOferta(exp) {
  if (!exp.oferta || exp.oferta.estado !== 'borrador') return
  avanzar(30)
  exp.oferta.estado = 'enviada'
  exp.oferta.vence = db.reloj + 5 * DIA // los 5 días corren desde que el cliente la recibe, no desde el borrador
  exp.oferta.texto = textoOferta(exp)
  evento(exp, 'hum', `${persona('comercial')} · Comercial`, `Revisó y envió la oferta v${exp.oferta.version}`, `${q(exp.oferta.porTx)} por pago`, true)
  aviso(exp, 'Correo y SMS', 'Tu oferta está lista para revisión.')
}

function pedirAjusteOferta(exp, propuesta, motivo) {
  if (exp.oferta.estado !== 'enviada') return // ya venció: no se pide ajuste ni se mueve el reloj
  avanzar(2 * 60)
  if (exp.oferta.estado !== 'enviada') return // venció mientras el cliente escribía
  exp.oferta.estado = 'ajuste'
  exp.oferta.ajuste = { propuesta, motivo, t: db.reloj }
  evento(exp, 'cli', exp.empresa.representante.nombre, 'Pidió un ajuste a la oferta', `Propone ${q(propuesta)} por pago. ${motivo}`, true)
}

function responderAjuste(exp, porTx) {
  avanzar(60)
  const c = calcularComision(exp, porTx)
  const excepcion = porTx < c.porTxTarifa
  if (excepcion) evento(exp, 'hum', `${JEFATURA_COMERCIAL} · Jefatura Comercial`, 'Aprobó la excepción de comisión', `${q(porTx)} por pago (tarifa ${q(c.porTxTarifa)})`)
  exp.oferta.historial.push({ version: exp.oferta.version, porTx: exp.oferta.porTx })
  Object.assign(exp.oferta, c, { version: exp.oferta.version + 1, estado: 'enviada', excepcion, vence: db.reloj + 5 * DIA })
  exp.oferta.ajuste.respuesta = porTx
  const a3 = quienIA(3)
  exp.oferta.texto = textoOferta(exp)
  exp.oferta.textoPor = a3
  evento(exp, a3.actor, a3.quien, 'Actualizó el borrador de la oferta', `Versión ${exp.oferta.version}`)
  evento(exp, 'hum', `${persona('comercial')} · Comercial`, `Envió la oferta v${exp.oferta.version}`, `${q(porTx)} por pago`, true)
  aviso(exp, 'Correo y SMS', 'Respondimos tu solicitud de ajuste: revisa la nueva oferta.')
}

// Vencimiento de la oferta (H13): aritmética del reloj, como la firma. Solo vence una oferta enviada;
// con un ajuste pedido, el turno es de Comercial.
function vencerOferta(exp) {
  const o = exp.oferta
  o.estado = 'vencida'
  exp.eventos.push({ t: o.vence, actor: 'sis', quien: 'Sistema', etapa: 4, accion: 'La oferta venció sin respuesta del cliente', detalle: `v${o.version} · vigencia de 5 días`, pub: true })
  exp.eventos.sort((a, b) => a.t - b.t)
  exp.avisos.push({ t: o.vence, canal: 'Correo', texto: 'Tu oferta venció. Le avisamos a tu ejecutivo para que la renueve.' })
}

function revisarVigenciasOferta() {
  for (const e of db.expedientes) {
    if (e.oferta && e.etapa === 4 && e.estado === 'en_curso' && e.oferta.estado === 'enviada' && db.reloj >= e.oferta.vence) vencerOferta(e)
  }
}

function renovarOferta(exp) {
  avanzar(20)
  const o = exp.oferta
  o.estado = 'enviada'
  o.vence = db.reloj + 5 * DIA
  o.texto = textoOferta(exp)
  evento(exp, 'hum', `${persona('comercial')} · Comercial`, `Renovó la oferta v${o.version}`, `Mismas condiciones · vigente hasta el ${fecha(o.vence)}`, true)
  aviso(exp, 'Correo y SMS', `Renovamos tu oferta. Vence el ${fecha(o.vence)}.`)
}

function aceptarOferta(exp) {
  if (exp.oferta.estado !== 'enviada') return // ya venció: no se acepta ni se mueve el reloj
  avanzar(60)
  if (exp.oferta.estado !== 'enviada') return // venció mientras el cliente escribía el código
  exp.oferta.estado = 'aceptada'
  exp.oferta.aceptada = { t: db.reloj, por: exp.empresa.representante.nombre, metodo: 'OTP por SMS', ip: '190.56.•••.18 (simulada)' }
  evento(exp, 'cli', exp.empresa.representante.nombre, 'Aceptó la oferta digitalmente', `v${exp.oferta.version} · ${q(exp.oferta.porTx)} por pago`, true)
  evento(exp, 'sis', 'Sistema', 'Registró la aceptación y su evidencia', 'OTP verificado; fecha, hora e IP guardadas')
  avanzar(10)
  pasarEtapa(exp, 5)
  generarConvenio(exp)
}

// ── Etapa 5: convenio ──────────────────────────────────────────────────
function generarConvenio(exp, version = 1) {
  const pv = db.plantillas.vigente
  exp.convenio = { version, plantilla: `Convenio CCA Empresarial ${pv}`, plantillaVersion: pv, estado: 'revision_cliente', historial: exp.convenio ? exp.convenio.historial : [] }
  exp.convenio.textos = textosClausulas(exp)
  evento(exp, 'sis', 'Agente 4 · Generador de Convenio (determinístico)', `Generó el convenio v${version} desde la plantilla vigente`, `Plantilla ${pv} + condiciones aprobadas; sin modelo de lenguaje`, true)
  aviso(exp, 'Correo', 'Tu convenio está listo para revisión.')
}

function clienteConformeConvenio(exp) {
  avanzar(2 * 60)
  exp.convenio.estado = 'revision_legal'
  evento(exp, 'cli', exp.empresa.representante.nombre, 'Revisó el convenio y está conforme', `Versión ${exp.convenio.version}`, true)
  const a5 = quienIA(5)
  const exc = clausulasConvenio(exp).filter((c) => c.excepcion).map((c) => ({ clausula: c.n, texto: `Cláusula ${c.n} (${c.titulo}): acreditación el mismo día (T+0); la plantilla dice T+1. Es una condición especial pedida por el cliente y aceptada en la oferta.` }))
  if (exp.convenio.plantillaVersion !== db.plantillas.vigente) exc.push({ clausula: null, texto: `El convenio se generó con la plantilla ${exp.convenio.plantillaVersion} y la vigente es ${db.plantillas.vigente}: conviene generar una versión nueva.` })
  // Qué cláusulas cambiaron respecto de la versión anterior: comparar dos textos es aritmética, la hace el código.
  const previa = exp.convenio.historial.at(-1), cambios = previa && previa.textos ? Object.keys(exp.convenio.textos).filter((k) => exp.convenio.textos[k] !== previa.textos[k]).map(Number) : []
  exp.convenio.comparacion = { obligatorias: CLAUSULAS.length, presentes: CLAUSULAS.length, excepciones: exc, cambios, desde: previa ? previa.version : null, por: a5 }
  evento(exp, a5.actor, a5.quien, 'Comparó el convenio contra la plantilla y la oferta aceptada', `${CLAUSULAS.length}/${CLAUSULAS.length} cláusulas obligatorias · ${exc.length} ${exc.length === 1 ? 'excepción' : 'excepciones'}${previa ? ` · ${cambios.length ? `cambia la cláusula ${cambios.join(', ')}` : 'sin cambios'} respecto de la v${previa.version}` : ''}`)
}

function clienteAjusteConvenio(exp, texto) {
  avanzar(2 * 60)
  exp.convenio.estado = 'ajuste_cliente'
  exp.convenio.ajuste = texto
  evento(exp, 'cli', exp.empresa.representante.nombre, 'Pidió un ajuste al convenio', texto, true)
}

// Datos variables que Legal puede cambiar al atender un ajuste, con la cláusula que llenan. La comisión y la
// acreditación (cláusulas 6 y 8) vienen de la oferta aceptada: cambiarlas pide una oferta nueva.
const CAMPOS_CONVENIO = { reporteCorreo: ['Correo(s) del reporte diario', 7], reporteFormato: ['Formato del reporte', 7], refNombre: ['Dato del pagador', 4] }

// Lo que Legal cambia en el convenio cumple las mismas reglas que el formulario: correos válidos y un formato de la lista.
function errorCampoConvenio(k, v) {
  const t = String(v ?? '').trim()
  if (k === 'reporteCorreo') return t.split(/\s*[,;]\s*/).every((c) => FORMATO_CORREO.test(c)) ? '' : 'Escribe uno o más correos válidos, separados por coma.'
  if (k === 'reporteFormato') return FORMATOS_REPORTE.includes(t) ? '' : `Elige uno de estos formatos: ${FORMATOS_REPORTE.join(', ')}.`
  if (k === 'refNombre') return t ? '' : 'Escribe qué dato indicará el pagador.'
  return ''
}

function legalNuevaVersion(exp, cambios = {}) {
  avanzar(90)
  const aplicados = Object.entries(cambios).filter(([k, v]) => CAMPOS_CONVENIO[k] && !errorCampoConvenio(k, v) && String(v).trim() !== String(exp.servicio[k]))
  exp.convenio.historial.push({ version: exp.convenio.version, ajuste: exp.convenio.ajuste, devolucion: exp.convenio.devolucion, textos: exp.convenio.textos, cambios: Object.fromEntries(aplicados) })
  for (const [k, v] of aplicados) exp.servicio[k] = String(v).trim()
  const que = aplicados.map(([k]) => `${CAMPOS_CONVENIO[k][0]} (cláusula ${CAMPOS_CONVENIO[k][1]})`)
  evento(exp, 'hum', `${persona('legal')} · Legal`, 'Gestionó una nueva versión del convenio', `${que.length ? `Cambió: ${que.join(', ')}` : 'Sin cambios en las cláusulas'}${exp.convenio.ajuste ? ` · pedido del cliente: «${exp.convenio.ajuste}»` : ''}${exp.convenio.devolucion ? ` · motivo de la cancelación de la firma: «${exp.convenio.devolucion}»` : ''}`)
  generarConvenio(exp, exp.convenio.version + 1)
}

function legalAprobar(exp) {
  if (!exp.convenio || exp.convenio.estado !== 'revision_legal') return
  avanzar(50)
  exp.convenio.estado = 'aprobado'
  evento(exp, 'hum', `${persona('legal')} · Legal`, 'Validó las cláusulas y aprobó la versión final', exp.convenio.comparacion && exp.convenio.comparacion.excepciones.length ? 'Acepta la condición especial de la cláusula 8' : '', true)
  avanzar(5)
  pasarEtapa(exp, 6)
  enviarAFirma(exp)
}

// ── Etapa 6: firma digital ─────────────────────────────────────────────
// Estados de la solicitud en el proveedor (§5): creado, enviado, visto, firmado, rechazado, expirado (y cancelado).
// f.estado es el estado del proceso en la plataforma: enviada, firmada_cliente, completada, rechazada, expirada, cancelada.
const SIS_FIRMA = 'Servicio de integración de firma'

function webhook(exp, tipo, duplicado = false, t = db.reloj) {
  const f = exp.firma
  const id = duplicado ? f.webhooks[f.webhooks.length - 1].id : `evt_${f.solicitud.slice(4).toLowerCase()}_${String(f.webhooks.length + 1).padStart(2, '0')}`
  f.webhooks.push({ t, id, tipo, resultado: duplicado ? 'Duplicado: ignorado (idempotente)' : 'Firma válida · procesado' })
}

// Un webhook sin la firma del proveedor se rechaza antes de procesarlo (§6: validados y autenticados).
function webhookInvalido(exp, tipo) {
  const f = exp.firma
  f.webhooks.push({ t: db.reloj, id: `evt_sin_firma_${String(f.webhooks.length + 1).padStart(2, '0')}`, tipo, resultado: 'Firma inválida: rechazado (401) · no cambió nada' })
  evento(exp, 'sis', SIS_FIRMA, 'Rechazó un webhook con firma inválida', `${tipo} · no cambió el estado (§6)`)
  incidente(SIS_FIRMA, 'webhook_rechazado', `${tipo} sin la firma del proveedor: rechazado (401)`, exp)
}

const ultimos4 = (s) => String(s).replace(/\D/g, '').slice(-4).padStart(4, '0')

function sesionesFirma(f, t) {
  f.vence = t + VIGENCIA_FIRMA_H * HORA
  f.sesiones = f.firmantes.filter((x) => x.estado !== 'firmado').map((x) => ({
    orden: x.orden, vence: f.vence,
    url: `https://firma.proveedor.example/s/${sha256(f.hash + x.orden + t).slice(0, 12)}`,
  }))
}

function nuevaFirma(exp, t) {
  const e = exp.empresa, hash = sha256(textoPlanoConvenio(exp))
  const cui = exp.vivo ? EXTRACCION_VIVO.dpi.campos.CUI : String(1000 + Number(exp.id.slice(-3)) * 7)
  const f = {
    estado: 'enviada', solicitud: 'SIG-' + hash.slice(0, 6).toUpperCase(), hash, webhooks: [], integridad: null, visto: false, reenvios: 0,
    estados: [{ estado: 'creado', t }, { estado: 'enviado', t }],
    firmantes: [
      { nombre: e.representante.nombre, rol: `Representante legal · ${e.comercial || e.razon}`, orden: 1, metodo: 'OTP por SMS', estado: 'pendiente',
        identificacion: `DPI •••• ••••• ${ultimos4(cui)}`, contacto: `${e.representante.correo || 'correo registrado'} · ${e.representante.telefono || '+502 •••• ' + ultimos4(e.nit)}` },
      { nombre: APODERADO, rol: 'Apoderado · Banrural', orden: 2, metodo: APODERADO_DATOS.metodo, estado: 'en espera',
        identificacion: APODERADO_DATOS.identificacion, contacto: APODERADO_DATOS.contacto },
    ],
  }
  sesionesFirma(f, t)
  return f
}

const estadoProveedor = (f) => f.estados[f.estados.length - 1].estado
// El estado del proveedor es el de toda la solicitud: con firma parcial sigue en «visto», así que se dice cuántos firmaron.
const resumenFirma = (f) => `${estadoProveedor(f)} · firmantes ${f.firmantes.filter((x) => x.estado === 'firmado').length} de ${f.firmantes.length}`
const clienteFirmo = (f) => f.firmantes[0].estado === 'firmado'

function enviarAFirma(exp) {
  exp.firma = nuevaFirma(exp, db.reloj)
  const f = exp.firma
  evento(exp, 'sis', 'Sistema', 'Generó el PDF del convenio y calculó su huella', `SHA-256 ${f.hash.slice(0, 16)}…`)
  evento(exp, 'sis', SIS_FIRMA, 'Creó la solicitud de firma con 2 firmantes en orden', f.solicitud, true)
  evento(exp, 'sis', SIS_FIRMA, 'Registró a los firmantes: identificación, contacto, orden y método', `${f.firmantes[0].nombre} (OTP por SMS) → ${APODERADO} (certificado)`)
  evento(exp, 'sis', SIS_FIRMA, 'Creó una sesión segura de firma para cada firmante', `Enlace vigente hasta ${fechaHora(f.vence)}`)
  webhook(exp, 'solicitud.creada')
  webhook(exp, 'solicitud.enviada')
  aviso(exp, 'Correo y SMS', `Tu convenio está listo para firma. El enlace vence el ${fechaHora(f.vence)}.`)
}

// El cliente abre su enlace de firma: el proveedor avisa «visto» una sola vez por envío.
function verFirma(exp) {
  const f = exp.firma
  if (!f || f.estado !== 'enviada' || f.visto) return
  avanzar(5)
  if (f.estado !== 'enviada') return // venció justo ahora: ya no se puede abrir
  f.visto = true
  f.estados.push({ estado: 'visto', t: db.reloj })
  webhook(exp, 'documento.visto')
  evento(exp, 'sis', SIS_FIRMA, 'El representante abrió su enlace de firma', 'Estado del proveedor: visto')
}

function firmarCliente(exp) {
  if (!exp.firma || exp.firma.estado !== 'enviada') return // Legal la canceló o venció mientras el cliente tenía el código abierto
  verFirma(exp)
  avanzar(2 * 60)
  const f = exp.firma
  if (f.estado !== 'enviada') return // el enlace venció antes de firmar: Legal decide (reenviar o cancelar)
  Object.assign(f.firmantes[0], { estado: 'firmado', t: db.reloj })
  f.firmantes[1].estado = 'pendiente'
  f.estado = 'firmada_cliente'
  evento(exp, 'cli', exp.empresa.representante.nombre, 'Firmó el convenio', 'Autenticado con OTP por SMS', true)
  webhook(exp, 'firmante.firmo')
  webhook(exp, 'firmante.firmo', true)
  evento(exp, 'sis', SIS_FIRMA, 'Recibió un webhook duplicado y lo ignoró', 'Procesamiento idempotente (§6)')
  webhookInvalido(exp, 'firmante.firmo')
}

function rechazarFirma(exp, motivo) {
  avanzar(60)
  const f = exp.firma
  if (f.estado !== 'enviada') return
  Object.assign(f.firmantes[0], { estado: 'rechazado', t: db.reloj })
  f.estado = 'rechazada'
  f.rechazo = { motivo, t: db.reloj }
  f.estados.push({ estado: 'rechazado', t: db.reloj })
  webhook(exp, 'firmante.rechazo')
  evento(exp, 'cli', exp.empresa.representante.nombre, 'No firmó el convenio', motivo, true)
  evento(exp, 'sis', SIS_FIRMA, 'Avisó a Legal que la firma fue rechazada', 'Legal decide si reenvía o cancela')
}

// Vencimiento: es aritmética del reloj, la hace el código. El evento lleva la hora real en que venció.
// La vigencia es de toda la solicitud: puede vencer con el cliente ya firmado, y entonces lo que faltó es la firma del apoderado.
function expirarFirma(exp, t) {
  const f = exp.firma, parcial = clienteFirmo(f)
  f.estado = 'expirada'
  f.estados.push({ estado: 'expirado', t })
  webhook(exp, 'solicitud.expirada', false, t)
  exp.eventos.push({ t, actor: 'sis', quien: SIS_FIRMA, etapa: 6, accion: parcial ? 'La solicitud de firma venció sin la firma del apoderado' : 'La solicitud de firma venció sin completarse', detalle: `${parcial ? 'El cliente ya había firmado · ' : ''}Vigencia de ${VIGENCIA_FIRMA_H} horas`, pub: true })
  exp.eventos.sort((a, b) => a.t - b.t)
  if (!parcial) exp.avisos.push({ t, canal: 'Correo', texto: 'Tu enlace de firma venció. Te enviaremos uno nuevo.' })
}

function revisarVigenciasFirma() {
  for (const e of db.expedientes) {
    const f = e.firma
    if (f && e.etapa === 6 && e.estado === 'en_curso' && ['enviada', 'firmada_cliente'].includes(f.estado) && db.reloj >= f.vence) expirarFirma(e, f.vence)
  }
}

function reenviarFirma(exp) {
  avanzar(20)
  const f = exp.firma
  f.firmantes.forEach((x) => { if (x.estado !== 'firmado') x.estado = 'en espera' })
  const siguiente = f.firmantes.find((x) => x.estado !== 'firmado')
  siguiente.estado = 'pendiente'
  f.estado = siguiente.orden === 1 ? 'enviada' : 'firmada_cliente'
  f.visto = false
  f.reenvios++
  delete f.rechazo
  sesionesFirma(f, db.reloj)
  f.estados.push({ estado: 'enviado', t: db.reloj })
  webhook(exp, 'solicitud.reenviada')
  evento(exp, 'hum', `${persona('legal')} · Legal`, 'Reenvió la solicitud de firma', `Enlace nuevo vigente hasta ${fechaHora(f.vence)}`, true)
  if (siguiente.orden === 1) aviso(exp, 'Correo y SMS', `Te enviamos un nuevo enlace para firmar tu convenio. Vence el ${fechaHora(f.vence)}.`)
}

function cancelarFirma(exp, motivo) {
  avanzar(20)
  const f = exp.firma
  f.estado = 'cancelada'
  f.estados.push({ estado: 'cancelado', t: db.reloj })
  webhook(exp, 'solicitud.cancelada')
  evento(exp, 'hum', `${persona('legal')} · Legal`, 'Canceló la solicitud de firma y devolvió el convenio a revisión', motivo, true)
  exp.firmasAnteriores = [...(exp.firmasAnteriores || []), { ...f, motivoCancelacion: motivo }]
  exp.firma = null
  pasarEtapa(exp, 5)
  Object.assign(exp.convenio, { estado: 'ajuste_cliente', ajuste: null, devolucion: motivo }) // lo devuelve Legal, no lo pide el cliente
  aviso(exp, 'Correo', 'Legal está revisando tu convenio otra vez. Te avisaremos cuando esté listo para firma.')
}

function consultarEstadoFirma(exp) {
  const f = exp.firma
  evento(exp, 'sis', SIS_FIRMA, 'Consultó el estado al proveedor', `Estado: ${resumenFirma(f)}`)
}

function firmarBanco(exp) {
  avanzar(45)
  const f = exp.firma
  if (f.estado !== 'firmada_cliente') return // venció antes de la firma del apoderado
  Object.assign(f.firmantes[1], { estado: 'firmado', t: db.reloj })
  f.estado = 'completada'
  f.completada = db.reloj
  f.estados.push({ estado: 'firmado', t: db.reloj })
  evento(exp, 'hum', `${APODERADO} · Apoderado Banrural`, 'Firmó el convenio por Banrural', 'Certificado de firma electrónica', true)
  webhook(exp, 'solicitud.completada')
  avanzar(1)
  f.integridad = sha256(textoPlanoConvenio(exp)) === f.hash
  evento(exp, 'sis', 'Sistema', 'Descargó el convenio firmado y la evidencia', 'Constancia de firma y sello de tiempo')
  evento(exp, 'sis', 'Sistema', f.integridad ? 'Validó la integridad: la huella coincide' : 'Integridad NO válida: la huella no coincide', `SHA-256 ${f.hash.slice(0, 16)}…`)
  // Validación final del journey (H25: la hace el sistema): cada punto es una comprobación del código.
  const firmados = f.firmantes.filter((x) => x.estado === 'firmado').length
  const puntos = [[firmados === f.firmantes.length, `firmas ${firmados} de ${f.firmantes.length}`], [f.integridad, f.integridad ? 'huella coincide' : 'huella NO coincide'], [true, 'convenio y evidencia descargados'], [exp.convenio.estado === 'aprobado', `convenio v${exp.convenio.version} aprobado por Legal`]]
  evento(exp, 'sis', 'Sistema', puntos.every(([b]) => b) ? 'Validación final del expediente: completa' : 'Validación final del expediente: con observaciones', puntos.map(([, txt]) => txt).join(' · '), true)
  // Simulación de resiliencia (§7): el gestor documental no responde al primer intento; el archivo queda en cola y se reintenta.
  evento(exp, 'sis', 'Sistema', 'El gestor documental no respondió: quedó en cola (intento 1 de 3)', 'Tiempo de espera de 30 s · caída simulada')
  incidente('Gestor documental', 'reintento', 'No respondió al archivar el convenio; quedó en cola y se reintentó a los 5 minutos', exp)
  avanzar(5)
  evento(exp, 'sis', 'Sistema', 'Reintentó: el gestor documental respondió', 'Intento 2 de 3')
  evento(exp, 'sis', 'Sistema', 'Archivó el convenio y los documentos en el gestor documental', 'Expediente digital consolidado', true)
  exp.generados = generadosFirma(exp, db.reloj)
  aviso(exp, 'Correo', 'Tu convenio quedó firmado por ambas partes.')
  avanzar(10)
  pasarEtapa(exp, 7)
  exp.param = { estado: 'pendiente', datos: datosParam(exp), pruebas: [], corregido: false }
}

// ── Etapas 7 y 8: parametrización, pruebas y activación ───────────────
function crearSolicitudParam(exp) {
  avanzar(60)
  exp.param.estado = 'configurando'
  evento(exp, 'hum', `${persona('operaciones')} · Operaciones`, 'Creó la solicitud de parametrización', exp.param.datos.convenio)
}

function validarParam(exp) {
  const d = exp.param.datos, err = {}
  const min = Number(d.minimo), max = Number(d.maximo)
  d.convenio = String(d.convenio).trim().toUpperCase() // se guarda como se confirma al activar
  const usa = db.expedientes.find((e) => e !== exp && e.param && String(e.param.datos.convenio).trim().toUpperCase() === d.convenio)
  if (!d.convenio) err.convenio = 'Escribe el código de convenio.'
  else if (!/^[A-Z0-9-]{3,20}$/.test(d.convenio)) err.convenio = 'Solo letras, números y guiones, de 3 a 20 caracteres (por ejemplo CCA-4185).'
  else if (usa) err.convenio = `El código ${d.convenio} ya lo usa ${usa.empresa.razon}.`
  if (!String(d.cuenta).trim()) err.cuenta = 'Escribe la cuenta de acreditación.'
  if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(String(d.corte).trim())) err.corte = 'Hora con formato HH:MM, por ejemplo 15:00.'
  if (!(min > 0)) err.minimo = 'El monto mínimo debe ser mayor que Q0.'
  if (!(max > 0)) err.maximo = 'El monto máximo debe ser mayor que Q0.'
  else if (min > 0 && max <= min) err.maximo = `El monto máximo debe ser mayor que el mínimo (${q(min)}).`
  ui.co.erroresParam = err
  return Object.keys(err).length === 0
}

function guardarParam(exp) {
  if (exp.param.estado !== 'configurando') return
  avanzar(90)
  exp.param.estado = 'probando'
  exp.param.pruebas = PRUEBAS_QA.map((p) => ({ ...p, estado: 'pendiente' }))
  evento(exp, 'hum', `${persona('operaciones')} · Operaciones`, 'Registró la configuración del convenio en el core', 'Carga manual: el core no tiene API conocida (pregunta 5)')
}

function ejecutarPruebas(exp) {
  avanzar(45)
  let fallas = 0
  for (const p of exp.param.pruebas) {
    if (p.estado === 'ok') continue
    if (p.id === 'reverso' && !exp.param.corregido) {
      p.estado = 'falla'
      p.nota = 'El reverso no se descontó del reporte diario.'
      fallas++
    } else {
      p.estado = 'ok'
      p.nota = ''
    }
  }
  const ok = exp.param.pruebas.filter((p) => p.estado === 'ok').length
  evento(exp, 'sis', 'Sistema', `Corrió las pruebas: ${ok} bien, ${fallas} con falla`, fallas ? 'Reverso de un pago el mismo día' : '')
  if (exp.param.pruebas.every((p) => p.estado === 'ok')) {
    exp.param.estado = 'listo'
    evento(exp, 'sis', 'Sistema', 'Servicio parametrizado y probado', `${ok}/${ok} pruebas bien`, true)
    aviso(exp, 'Correo', 'Tu servicio está listo. Te enviamos las instrucciones para tus pagadores.')
    avanzar(15)
    pasarEtapa(exp, 8)
  }
}

function corregirPrueba(exp, id) {
  const p = exp.param.pruebas.find((x) => x.id === id)
  if (!p || p.estado !== 'falla') return
  avanzar(40)
  exp.param.corregido = true
  p.estado = 'pendiente'
  p.nota = 'Corregido: listo para volver a probar.'
  evento(exp, 'hum', `${persona('operaciones')} · QA`, 'Corrigió la configuración del reverso', 'El reverso ahora descuenta del reporte del día')
}

function activar(exp) {
  if (exp.etapa !== 8 || exp.estado !== 'en_curso' || exp.activacion) return
  avanzar(30)
  exp.estado = 'activo'
  exp.activacion = { t: db.reloj, codigo: exp.param.datos.convenio }
  evento(exp, 'hum', `${persona('operaciones')} · Operaciones`, 'Pasó el servicio a producción', `Convenio ${exp.param.datos.convenio}`, true)
  evento(exp, 'sis', 'Sistema', 'Activó el monitoreo del servicio', 'Pagos, reverso, reporte diario y acreditación')
  aviso(exp, 'Correo y SMS', `Tu servicio de cobro está activo. Convenio ${exp.param.datos.convenio}.`)
}

// ── Agente 6: el código detecta, el agente redacta, una regla envía ────
function alertasSeguimiento() {
  return db.expedientes
    .map((e) => ({ e, s: semaforo(e) }))
    .filter((x) => x.s && x.s.nivel === 'error')
    .map(({ e, s }) => ({ exp: e, dias: s.dias, sla: s.sla, mensaje: mensajeSeguimiento(e, s), enviada: alertaVigente(e) }))
}

// Alertas de esta entrada a la etapa. Una alerta guardada sin «entrada» (estado de antes) cuenta como de la actual.
const alertasDeEntrada = (e) => (e.alertas || []).filter((a) => a.etapa === e.etapa && (a.entrada ?? e.enEtapaDesde) === e.enEtapaDesde)
// La última que se envió: es la que muestran Monitoreo y el Resumen.
function alertaVigente(e) { return alertasDeEntrada(e).at(-1) || null }

const diasTxt = (n) => `${n} ${n === 1 ? 'día' : 'días'}`

// A quién le toca: lo calcula el código con el estado del expediente. Si lo pendiente es del cliente,
// la alerta va a su asesor (o a Comercial) y al cliente le llega un recordatorio.
function responsableSeguimiento(e) {
  const cliente = (texto) => ({ ...(e.asesor ? { persona: e.asesor, rol: 'Asesor' } : { persona: persona('comercial'), rol: 'Comercial' }), cliente: true, recordatorio: texto })
  const area = (rol) => ({ persona: persona(rol), rol: ROLES[rol].nombre, cliente: false })
  const abiertas = e.obs.filter((o) => o.estado === 'abierta').length
  if (e.estado === 'observado' && abiertas) return cliente(`tu solicitud ${e.id} tiene ${abiertas} ${abiertas === 1 ? 'observación' : 'observaciones'} por resolver.`)
  if (e.etapa === 1) return cliente(`tu solicitud ${e.id} está a medias. Puedes retomarla donde la dejaste.`)
  if (e.etapa === 3 && e.evaluacion) {
    const p = AREAS_EVAL.filter((a) => e.evaluacion[a].estado === 'pendiente')
    if (p.length) return { persona: p.map(persona).join(', '), rol: p.map((a) => ROLES[a].nombre).join(', '), cliente: false }
  }
  if (e.etapa === 4 && e.oferta && e.oferta.estado === 'enviada') return cliente(`tu oferta está lista y vence el ${fecha(e.oferta.vence)}.`)
  if (e.etapa === 4) return area('comercial')
  if (e.etapa === 5 && e.convenio && e.convenio.estado === 'revision_cliente') return cliente('tu convenio está listo para revisión.')
  if (e.etapa === 5) return area('legal')
  if (e.etapa === 6 && e.firma && e.firma.estado === 'enviada') return cliente(`tu convenio espera tu firma. El enlace vence el ${fechaHora(e.firma.vence)}.`)
  if (e.etapa === 6) return area('legal')
  return area('operaciones')
}

// Una alerta por responsable y por entrada a la etapa: si el expediente vuelve a la etapa, o si el turno pasa a
// alguien que no tenía alerta (vence la firma y le toca a Legal), sale otra. Va a la hora en que el sistema pudo
// detectar el SLA vencido: cuando venció, o «desde» (el reloj de la revisión anterior) si venció antes de eso, porque
// la regla cambió o la semilla ya venía vencida. Desde «desde» hasta ahora el estado es el actual, así que el texto
// es cierto a esa hora. No cambia nada.
function revisarSeguimiento(desde = db.reloj) {
  for (const e of db.expedientes) {
    const s = semaforo(e)
    if (!s || s.nivel !== 'error') continue
    const r = responsableSeguimiento(e), previas = alertasDeEntrada(e)
    const avisado = (p) => previas.some((a) => (a.cliente === undefined || a.cliente === r.cliente) && a.para.split(', ').includes(p))
    if (r.persona.split(', ').every(avisado)) continue
    const t = Math.max(e.enEtapaDesde + s.sla * DIA, desde), etapa = ETAPAS[e.etapa - 1].nombre
    const a6 = quienIA(6), porIA = a6.actor === 'ia'
    const mensaje = porIA ? mensajeSeguimiento(e, { ...s, dias: (t - e.enEtapaDesde) / DIA }) : `${e.empresa.razon} venció el SLA de ${etapa} (${diasTxt(s.sla)}). Siguiente paso: ${pasoEnFrase(e)}. Aviso fijo: el Agente 6 está en pausa.`
    const ev = (actor, quien, accion, detalle, pub = false) => e.eventos.push({ t, actor, quien, etapa: e.etapa, accion, detalle, pub })
    ev('sis', 'Sistema', `Detectó el SLA vencido en ${etapa}`, `SLA de ${diasTxt(s.sla)}`)
    if (porIA) ev('ia', a6.quien, `Redactó la alerta de seguimiento para ${r.persona}`, mensaje)
    ev('sis', 'Sistema', `Envió la alerta a ${r.persona} (${r.rol}) por correo interno`, porIA ? 'Texto del Agente 6' : 'Aviso fijo: el Agente 6 está en pausa')
    ;(e.alertas = e.alertas || []).push({ t, etapa: e.etapa, entrada: e.enEtapaDesde, cliente: r.cliente, para: r.persona, rol: r.rol, mensaje, porIA })
    if (r.cliente) {
      ev('sis', 'Sistema', 'Envió un recordatorio al cliente', r.recordatorio, true)
      e.avisos.push({ t, canal: 'Correo y SMS', texto: `Recordatorio: ${r.recordatorio}` })
      e.avisos.sort((a, b) => a.t - b.t)
    }
    e.eventos.sort((a, b) => a.t - b.t)
  }
}

function mensajeSeguimiento(e, s) {
  const obs = e.obs.find((o) => o.estado === 'abierta')
  if (e.estado === 'observado' && obs) return `${e.asesor ? `Hola, ${e.asesor.split(' ')[0]}` : 'Hola'}: ${e.empresa.razon} lleva ${dec1(s.dias)} días sin responder una observación («${sinPunto(obs.texto)}»). ¿Le llamas hoy para ayudarle a completarla?`
  if (e.etapa === 4 && e.oferta && e.oferta.estado === 'vencida') return `Comercial: la oferta de ${e.empresa.razon} venció el ${fecha(e.oferta.vence)} sin respuesta del cliente. ¿La renuevas?`
  if (e.etapa === 4 && e.oferta && e.oferta.estado === 'ajuste') return `Comercial: ${e.empresa.razon} pidió un ajuste a la oferta hace ${dec1(s.dias)} días y sigue sin respuesta. El SLA de la etapa es de ${diasTxt(s.sla)}.`
  if (e.etapa === 6 && e.firma && ['rechazada', 'expirada'].includes(e.firma.estado)) return `Legal: la firma del convenio de ${e.empresa.razon} ${e.firma.estado === 'rechazada' ? `fue rechazada («${sinPunto(e.firma.rechazo.motivo)}»)` : clienteFirmo(e.firma) ? 'venció sin la firma del apoderado (el cliente ya firmó)' : 'venció sin completarse'}. ¿Reenvías el enlace o lo devuelves a revisión?`
  if (e.etapa === 3 && e.evaluacion) {
    const p = AREAS_EVAL.filter((a) => e.evaluacion[a].estado === 'pendiente').map((a) => ROLES[a].nombre)
    if (p.length) return `${e.empresa.razon} lleva ${dec1(s.dias)} días en ${ETAPAS[2].nombre} (SLA ${diasTxt(s.sla)}). Falta que decida: ${p.join(', ')}. ¿Lo revisas hoy?`
  }
  if (e.etapa === 7 && e.param && e.param.pruebas.length) {
    const falla = e.param.pruebas.find((p) => p.estado === 'falla'), pend = e.param.pruebas.filter((p) => p.estado === 'pendiente')
    if (falla) return `Operaciones / QA: en ${e.empresa.razon} falló la prueba «${falla.nombre}» (${falla.nota}). ¿La corriges hoy?`
    if (pend.length) return `Operaciones / QA: ${e.empresa.razon} lleva ${dec1(s.dias)} días en ${ETAPAS[6].nombre}. Faltan ${pend.length} de ${e.param.pruebas.length} pruebas por correr, empezando por «${pend[0].nombre}».`
  }
  return `${e.empresa.razon} lleva ${dec1(s.dias)} días en ${ETAPAS[e.etapa - 1].nombre} (SLA ${diasTxt(s.sla)}). Siguiente paso: ${pasoEnFrase(e)}.`
}

function reporteDiario(exp) {
  const filas = [
    ['08:14', 'Agencia Quetzaltenango Centro', '00045812', 'Efectivo', 350],
    ['09:02', 'Agencia San Marcos', '00031177', 'Cheque propio', 1225],
    ['10:47', 'Agencia Huehuetenango', '00052290', 'Efectivo', 180],
    ['11:30', 'Punto de servicio Totonicapán', '00012764', 'Efectivo', 420],
    ['14:05', 'Agencia Retalhuleu', '00049913', 'Cheque otro banco', 2300],
  ]
  return { filas, total: filas.reduce((a, f) => a + f[4], 0), convenio: exp.activacion ? exp.activacion.codigo : '' }
}

// ── Descargas de la firma (§5): el convenio firmado y su constancia, como archivos de texto ──────
// Lo que el proceso deja en el gestor documental al cerrar la firma (§5: actualización documental).
function generadosFirma(exp, t) {
  return [
    { nombre: `Convenio firmado v${exp.convenio.version}`, v: 'convenio', archivo: archivoConvenioFirmado(exp).nombre, t, huella: exp.firma.hash },
    { nombre: 'Constancia de firma y evidencia', v: 'evidencia', archivo: archivoEvidencia(exp).nombre, t, huella: null },
  ]
}

function archivoConvenioFirmado(exp) {
  const f = exp.firma
  const firmas = f.firmantes.map((x) => `${x.orden}. ${x.nombre} · ${x.rol} · ${x.identificacion} · ${x.metodo} · firmó el ${fechaHora(x.t)}`).join('\n')
  return {
    nombre: `convenio_${exp.id}_v${exp.convenio.version}_firmado.txt`,
    texto: `${textoPlanoConvenio(exp)}\n\nFIRMAS\n${firmas}\n\nSolicitud de firma ${f.solicitud}\nHuella SHA-256: ${f.hash}\n\nPrototipo de HyperReality: datos ficticios, no es un documento real.`,
  }
}

function archivoEvidencia(exp) {
  const f = exp.firma
  const firmantes = f.firmantes.map((x) => ({ orden: x.orden, nombre: x.nombre, identificacion: x.identificacion, contacto: x.contacto, metodo: x.metodo, firmo: x.t ? new Date(x.t).toISOString() : null, ip: x.orden === 1 ? '190.56.•••.18 (simulada)' : 'Red interna del banco (simulada)', certificado: x.orden === 2 ? APODERADO_DATOS.certificado : null }))
  const constancia = {
    expediente: exp.id, solicitud: f.solicitud, convenio: `v${exp.convenio.version} · ${exp.convenio.plantilla}`,
    huella_sha256: f.hash, integridad: f.integridad ? 'La huella del documento firmado coincide' : 'Sin validar',
    sello_de_tiempo: f.completada ? new Date(f.completada).toISOString() : null,
    estados: f.estados.map((x) => ({ estado: x.estado, t: new Date(x.t).toISOString() })),
    webhooks: f.webhooks.map((w) => ({ id: w.id, evento: w.tipo, resultado: w.resultado, t: new Date(w.t).toISOString() })),
    firmantes, nota: 'Prototipo de HyperReality: datos ficticios y proveedor de firma simulado.',
  }
  return { nombre: `evidencia_firma_${exp.id}.txt`, texto: JSON.stringify(constancia, null, 2) }
}

// ── Consola: configuración ──────────────────────────────────────────────
const siguienteVersion = (v) => { const [a, b] = v.slice(1).split('.').map(Number); return `v${a}.${b + 1}` }

// Publica una versión nueva de la plantilla. Sin la aprobación de Legal no se publica (§4: Legal es dueño del texto).
function publicarPlantilla(fijas, aprobadaLegal) {
  if (!aprobadaLegal) return { error: 'Falta la aprobación de Legal: marca la casilla cuando Legal la haya aprobado.' }
  const actual = plantillaVigente()
  const cambios = Object.keys(fijas).filter((n) => fijas[n].trim() !== actual.fijas[n])
  if (!cambios.length) return { error: 'No cambiaste ninguna cláusula.' }
  if (cambios.some((n) => !fijas[n].trim())) return { error: 'Una cláusula no puede quedar vacía.' }
  const version = siguienteVersion(actual.version)
  actual.estado = 'Histórica'
  const nuevas = {}
  for (const n of Object.keys(actual.fijas)) nuevas[n] = fijas[n].trim()
  db.plantillas.versiones.push({ version, estado: 'Vigente', fecha: fecha(db.reloj), aprobo: persona('legal'), cambios: cambios.map(Number), fijas: nuevas })
  db.plantillas.vigente = version
  anotarCambio('plantillas', `Publicó la plantilla ${version}: cambió la${cambios.length > 1 ? 's cláusulas' : ' cláusula'} ${cambios.join(', ')}. Aprobó ${persona('legal')}.`)
  return { version }
}

function agregarUsuario(nombre, rol) {
  const n = nombre.trim()
  if (!n) return { error: 'Escribe el nombre de la persona.' }
  if (db.usuarios.some((u) => u.nombre.toLowerCase() === n.toLowerCase())) return { error: 'Ya hay una persona con ese nombre.' }
  db.usuarios.push({ nombre: n, cargo: ROLES[rol].nombre, rol, activo: true, fijo: false })
  anotarCambio('usuarios', `Agregó a ${n} con el rol ${ROLES[rol].nombre}`)
  return {}
}

function cambiarUsuario(i, cambio) {
  const u = db.usuarios[i]
  if (!u || u.fijo) return
  if ('activo' in cambio) { u.activo = cambio.activo; anotarCambio('usuarios', `${u.activo ? 'Activó' : 'Desactivó'} a ${u.nombre}`) }
  if ('rol' in cambio && cambio.rol !== u.rol) { u.rol = cambio.rol; u.cargo = ROLES[u.rol].nombre; anotarCambio('usuarios', `Cambió el rol de ${u.nombre} a ${ROLES[u.rol].nombre}`) }
}

function agregarMotivo(texto) {
  const t = texto.trim()
  if (!t) return { error: 'Escribe el motivo.' }
  if (db.catalogos.motivos.some((m) => m.toLowerCase() === t.toLowerCase())) return { error: 'Ese motivo ya está.' }
  db.catalogos.motivos.push(t)
  anotarCambio('catalogos', `Agregó el motivo de observación «${t}»`)
  return {}
}

function quitarMotivo(i) {
  const [m] = db.catalogos.motivos.splice(i, 1)
  if (m) anotarCambio('catalogos', `Quitó el motivo de observación «${m}»`)
}

function cambiarModalidad(k) {
  const mods = db.catalogos.modalidades
  if (mods[k] && Object.values(mods).filter(Boolean).length === 1) return { error: 'Debe quedar al menos una modalidad activa.' }
  mods[k] = !mods[k]
  anotarCambio('catalogos', `${mods[k] ? 'Activó' : 'Desactivó'} la modalidad «${MODALIDADES[k].nombre}»`)
  return {}
}

function cambiarDocRequerido(tipoEmpresa, doc, requerido) {
  const lista = db.catalogos.docsPorTipo[tipoEmpresa]
  const esta = lista.includes(doc)
  if (requerido === esta) return {}
  if (!requerido && lista.length === 1) return { error: `Debe quedar al menos un documento para ${minuscula(TIPOS_EMPRESA[tipoEmpresa])}.` }
  if (requerido) lista.push(doc)
  else lista.splice(lista.indexOf(doc), 1)
  anotarCambio('catalogos', `${requerido ? 'Pide' : 'Ya no pide'} «${DOC_TIPOS[doc].nombre}» a ${minuscula(TIPOS_EMPRESA[tipoEmpresa])}`)
  return {}
}

function nuevaVersionRiesgo(que) {
  db.riesgo.version = siguienteVersion(db.riesgo.version)
  anotarCambio('reglas', `Reglas de riesgo ${db.riesgo.version}: ${que}`)
}

// ── portal.js ──
/* Vista A — Portal de Onboarding (Cliente / Asesor). [D §3]: crear solicitud, consultar cliente, formulario,
 * documentos, subsanar observaciones, oferta, aceptación, firma y seguimiento. */

const PASOS_ASIS = [
  ['identificacion', 'Identificación'],
  ['servicio', 'Servicio de cobro'],
  ['formulario', 'Formulario'],
  ['documentos', 'Documentos'],
  ['revision', 'Revisión y envío'],
]

function vistaPortal() {
  const p = ui.portal
  let cuerpo
  if (p.paso === 'asesor') cuerpo = portalAsesor()
  else if (p.paso === 'seguimiento') cuerpo = portalSeguimiento()
  else if (p.paso === 'inicio' || !p.borrador) cuerpo = portalInicio()
  else cuerpo = portalAsistente()
  return `<div class="portal">
    <div class="segmentos"><span>Personas</span><span>Mipymes</span><span class="act">Empresas</span><span>Instituciones</span></div>
    ${cabPortal()}
    <div class="portal-cuerpo">${cuerpo}</div>
  </div>`
}

function cabPortal() {
  const b = ui.portal.borrador, vivo = expVivo()
  let sesion = ''
  if (ui.rol === 'asesor') sesion = `<span class="fila peq"><span class="avatar">CR</span><span><b>${persona('asesor')}</b><br><span class="mut mini">Asesor · Agencia Quetzaltenango</span></span></span>`

const pct = (c) => `${Math.round(c * 100)} %`

function pasoDocumentos() {
  const b = ui.portal.borrador, req = docsRequeridos()
  const listos = req.filter((t) => b.docs[t] && b.docs[t].estado === 'listo').length
  const analizando = Object.keys(b.analizando || {})
  const usados = new Set([...Object.values(b.docs).map((d) => d.archivo), ...(b.noRequeridos || []).map((n) => n.archivo), ...analizando])
  const disponibles = ARCHIVOS_EJEMPLO.filter((a) => !usados.has(a.archivo) && (req.includes(a.tipo) || a.tipo === 'estados_financieros'))
  const slots = req.map((t) => {
    const d = b.docs[t]
    if (!d) return `<div class="doc-slot" id="slot-${t}"><div class="doc-ico">PDF</div><div><b>${DOC_TIPOS[t].nombre}</b><div class="mini mut">Pendiente: sube el archivo y el agente lo pondrá aquí</div></div><span class="chip">Falta</span></div>`
    const campos = d.campos ? `<div class="extraido">${Object.entries(d.campos).map(([k, v]) => `<span>${k}: <b>${esc(v)}</b></span>`).join('')}</div>` : `<div class="mini mut">Clasificado a mano: los datos los revisa una persona (Agente 1 en pausa)</div>`
    const clasif = d.clasif && d.clasif.por === 'ia' ? `<span class="chip ok">${icono('check', 'p')}Reconocido · ${pct(d.clasif.confianza)}</span>` : '<span class="chip">Clasificación manual</span>'
    return `<div class="doc-slot cargado" id="slot-${t}"><div class="doc-ico">PDF</div><div><div class="fila" style="gap:8px"><b>${DOC_TIPOS[t].nombre}</b>${clasif}</div><div class="mini mut">${esc(d.archivo)} · pág. ${d.pag}</div>${campos}</div><button class="btn txt chico" data-a="quitar-doc" data-v="${t}">Quitar</button></div>`
  }).join('')
  const enAnalisis = analizando.map((n) => `<div class="doc-slot analizando"><div class="doc-ico">PDF</div><div><b>${esc(n)}</b><div class="mini" style="color:var(--ia)"><span class="girando"></span> Agente 1 analizando: ¿qué documento es?</div></div><span></span></div>`).join('')
  const noPedidos = (b.noRequeridos || []).map((n) => `<div class="aviso-linea info">${icono('info')}<span><b>${esc(n.archivo)}</b>: ${n.confianza != null ? `el Agente 1 lo reconoció como ${minuscula(DOC_TIPOS[n.tipo].nombre)} (${pct(n.confianza)})` : `es ${minuscula(DOC_TIPOS[n.tipo].nombre)} (clasificado a mano)`}. No se pide para ${minuscula(TIPOS_EMPRESA[b.empresa.tipo])}, así que no se adjunta.</span></div>`).join('')
  const faltan = req.length - listos
  return `<div class="tarjeta">
    <div class="fila-e"><h2>Documentos de la empresa</h2><span class="chip">${TIPOS_EMPRESA[b.empresa.tipo]}</span></div>
    <p class="mut" style="margin-top:6px">La lista depende del tipo de empresa <span class="chip aviso">lista por confirmar con Banrural</span></p>
    <div class="caja-ia" style="margin-top:16px">
      <div class="cab">${icono('chispa', 'p')}Agente 1 · Documentación inteligente <span class="chip ia">Hallazgos · no aprueba</span></div>
      <p class="peq">Sube tus archivos con el nombre que tengan: el agente reconoce qué documento es cada uno, lo pone en su lugar y extrae sus datos. La validación completa (que estén todos, vigencias y cruce con el formulario) corre al enviar.</p>
    </div>
    <div class="tarjeta plana" style="margin-top:14px" id="mis-archivos">
      <div class="fila-e"><h4>Archivos en tu computadora <span class="chip">simulado</span></h4>
        ${faltan ? `<button class="btn sec chico" data-a="cargar-todos" id="btn-cargar-todos">${icono('subir', 'p')}Subir ${faltan === req.length ? `los ${req.length}` : faltan === 1 ? 'el que falta' : `los ${faltan} que faltan`}</button>` : ''}</div>
      <div class="fila" style="gap:8px;margin-top:10px">${disponibles.length ? disponibles.map((a) => `<button class="chip" data-a="subir-archivo" data-v="${esc(a.archivo)}">${icono('subir', 'p')}${esc(a.archivo)}</button>`).join('') : '<span class="mut peq">Ya subiste todos los archivos de ejemplo.</span>'}</div>
    </div>
    <div class="col" style="margin-top:14px;gap:10px" id="lista-docs">${enAnalisis}${slots}${noPedidos}</div>
    <div class="fila-e" style="margin-top:14px">
      <span class="mut peq num">${listos} de ${req.length} documentos</span>
    </div>
    ${faltan && !analizando.length ? `<div class="aviso-linea aviso" style="margin-top:12px">${icono('alerta')}<span>${faltan === 1 ? 'Falta 1. Puedes continuar: la validación te lo pedirá y la solicitud no avanza hasta que lo subas.' : `Faltan ${faltan}. Puedes continuar: la validación te los pedirá y la solicitud no avanza hasta completarlos.`}</span></div>` : ''}
  </div>
  ${navAsistente(!analizando.length)}`
}

  return `<div class="tarjeta">

  return `
  ${ui.rol === 'asesor' ? `<button class="btn txt" data-a="volver-asesor" style="margin-bottom:8px">${icono('volver', 'p')}Mis clientes</button>`

}

function accionCliente(exp) {
  const consulta = !exp.vivo
  const soloRep = ui.rol === 'asesor'
  const bloqueoRep = (que) => `<div class="bloqueado">${icono('candado', 'p')}Solo el representante legal puede ${que}. Le enviamos el enlace a ${esc(exp.empresa.representante.correo || 'su correo')}.</div>`

  if (ui.portal.validando) return `<div class="accion-cliente gris" id="accion"><div class="fila"><span class="girando"></span><h3>Validando tu solicitud…</h3></div><p class="mut peq" style="margin-top:6px">El sistema revisa formatos y vigencias y el Agente 1 compara tus documentos contra el formulario.</p></div>`
  if (exp.estado === 'rechazado') {
    const r = Object.values(exp.evaluacion || {}).find((a) => a.estado === 'rechazado')
    return `<div class="accion-cliente gris" id="accion"><h3>Tu solicitud no fue aprobada</h3><p class="mut" style="margin-top:6px">${esc(r ? r.comentario : '')}</p><p class="peq" style="margin-top:10px">Tu asesor te contactará para explicarte las opciones.</p></div>`
  }
  if (exp.estado === 'activo') return servicioActivo(exp)
  if (consulta) return `<div class="accion-cliente gris" id="accion"><h3>${esc(siguientePaso(exp))}</h3><p class="mut peq" style="margin-top:6px">Vista de consulta del asesor. En esta demo las acciones están en el expediente del recorrido.</p></div>`

  const abiertas = exp.obs.filter((o) => o.estado === 'abierta')
  if (abiertas.length) {
    return `<div class="accion-cliente" id="accion">
      <h3>Necesitamos que resuelvas ${abiertas.length === 1 ? 'una observación' : `${abiertas.length} observaciones`}</h3>
      ${abiertas.map((o) => `<div class="tarjeta plana" style="margin-top:12px">
        <div class="fila" style="gap:8px"><span class="chip aviso">${o.area === 'validacion' ? 'Validación automática' : ROLES[o.area].nombre}</span><span class="mini mut">${fechaHora(o.t)}</span></div>
        <p style="margin-top:8px">${esc(o.texto)}</p>
        ${o.tipo === 'documento'
          ? `<button class="btn" style="margin-top:12px" data-a="subsanar-doc" data-v="${o.id}" id="btn-subsanar">${icono('subir', 'p')}Subir ${minuscula(DOC_TIPOS[o.doc].nombre)}</button>`
          : `<textarea class="entrada" rows="2" data-c="resp-${o.id}" placeholder="Escribe tu respuesta" style="margin-top:10px">${esc((ui.respuestas || {})[o.id] || '')}</textarea><button class="btn" style="margin-top:10px" data-a="responder-obs" data-v="${o.id}">Responder</button>`}
      </div>`).join('')}
    </div>`
  }
  switch (exp.etapa) {
    case 2: return `<div class="accion-cliente gris" id="accion"><h3>Validando tu solicitud</h3><p class="mut peq">Revisamos formatos, vigencias y documentos.</p></div>`
    case 3: return `<div class="accion-cliente gris" id="accion"><h3>Estamos evaluando tu solicitud</h3><p class="mut peq" style="margin-top:4px">Tres áreas la revisan al mismo tiempo. No tienes que hacer nada.</p>
      <div class="col" style="margin-top:12px;gap:8px">${['comercial', 'riesgos', 'cumplimiento'].map((a) => `<div class="fila-e peq"><span>${ROLES[a].nombre}</span>${chipDecision(exp.evaluacion[a].estado)}</div>`).join('')}</div></div>`
    case 4: {
      const o = exp.oferta
      if (o.estado === 'borrador') return `<div class="accion-cliente gris" id="accion"><h3>Estamos preparando tu oferta</h3><p class="mut peq">Tu ejecutivo la revisa antes de enviártela.</p></div>`
      if (o.estado === 'vencida') return `<div class="accion-cliente gris" id="accion"><h3>Tu oferta venció el ${fecha(o.vence)}</h3><p class="mut peq">Le avisamos a tu ejecutivo para que la renueve. Te escribiremos cuando esté vigente otra vez.</p></div>`
      if (o.estado === 'ajuste') return `<div class="accion-cliente gris" id="accion"><h3>Pediste un ajuste</h3><p class="mut peq">Propusiste ${q(o.ajuste.propuesta)} por pago. Comercial está revisando tu solicitud.</p></div>`
      return `<div class="accion-cliente verde" id="accion">
        <div class="fila-e"><h3>Tu oferta está lista</h3><span class="chip">Versión ${o.version}${o.excepcion ? ' · condición preferencial' : ''}</span></div>
        <p class="peq" style="margin-top:8px">${esc(o.texto)}</p>
        ${tablaOferta(exp)}
        ${soloRep ? bloqueoRep('aceptar la oferta') : `<div class="fila" style="margin-top:14px"><button class="btn vrd" data-a="abrir-otp" data-v="aceptar" id="btn-aceptar">${icono('check', 'p')}Aceptar oferta</button><button class="btn sec" data-a="abrir-ajuste" id="btn-ajuste">Pedir un ajuste</button></div>`}
      </div>`
    }
    case 5: {
      const c = exp.convenio
      if (c.estado !== 'revision_cliente') return `<div class="accion-cliente gris" id="accion"><h3>${c.estado === 'ajuste_cliente' ? 'Legal está preparando una versión nueva de tu convenio' : 'Legal está revisando tu convenio'}</h3><p class="mut peq">Te avisaremos cuando esté listo para firma.</p></div>`
      return `<div class="accion-cliente verde" id="accion">
        <div class="fila-e"><h3>Revisa tu convenio</h3><span class="chip">Versión ${c.version}</span></div>
        <p class="mut peq" style="margin-top:4px">Se generó con la plantilla aprobada y las condiciones que aceptaste.</p>
        <div style="margin-top:12px">${documentoConvenio(exp)}</div>
        ${soloRep ? bloqueoRep('dar conformidad') : `<div class="fila" style="margin-top:14px"><button class="btn vrd" data-a="convenio-conforme" id="btn-conforme">${icono('check', 'p')}Estoy conforme</button><button class="btn sec" data-a="abrir-ajuste-convenio">Pedir un ajuste</button></div>`}
      </div>`
    }
    case 6: {
      const f = exp.firma
      if (f.estado === 'enviada') {
        const s = f.sesiones.find((x) => x.orden === 1)
        return `<div class="accion-cliente verde" id="accion">
        <h3>Firma tu convenio</h3>
        <p class="mut peq" style="margin-top:4px">Primero firmas tú y después el apoderado de Banrural. Te autenticamos con un código por SMS.</p>
        <div class="aviso-linea info" style="margin-top:10px">${icono('enlace')}<span>Enlace seguro de firma <span class="webhook">${esc(s.url.replace('https://', ''))}</span> · vigente hasta el ${fechaHora(s.vence)}</span></div>
        ${firmantesHTML(f)}
        ${soloRep ? bloqueoRep('firmar') : `<div class="fila" style="margin-top:14px"><button class="btn vrd" data-a="abrir-otp" data-v="firmar" id="btn-firmar">${icono('firma', 'p')}Abrir y firmar el convenio</button><button class="btn sec" data-a="abrir-rechazo-firma" id="btn-no-firmar">No firmar</button></div>`}
      </div>`
      }
      if (f.estado === 'rechazada') return `<div class="accion-cliente gris" id="accion"><h3>No firmaste el convenio</h3><p class="mut peq" style="margin-top:4px">Tu motivo: «${esc(sinPunto(f.rechazo.motivo))}». Legal lo revisa y te enviará un enlace nuevo o una versión corregida.</p>${firmantesHTML(f)}</div>`
      if (f.estado === 'expirada' && clienteFirmo(f)) return `<div class="accion-cliente gris" id="accion"><h3>Firmaste tu convenio</h3><p class="mut peq" style="margin-top:4px">La solicitud venció el ${fechaHora(f.vence)} antes de la firma del apoderado de Banrural. Por ahora no tienes que hacer nada: Legal decide cómo seguir.</p>${firmantesHTML(f)}</div>`
      if (f.estado === 'expirada') return `<div class="accion-cliente gris" id="accion"><h3>Tu enlace de firma venció</h3><p class="mut peq" style="margin-top:4px">Venció el ${fechaHora(f.vence)} sin completarse. Legal te enviará uno nuevo.</p>${firmantesHTML(f)}</div>`
      return `<div class="accion-cliente gris" id="accion"><h3>Firmaste tu convenio</h3><p class="mut peq">Falta la firma del apoderado de Banrural.</p>${firmantesHTML(f)}</div>`
    }
    case 7: {
      const p = exp.param, ok = p.pruebas.filter((x) => x.estado === 'ok').length
      return `<div class="accion-cliente gris" id="accion"><h3>Estamos configurando tu servicio</h3><p class="mut peq" style="margin-top:4px">Operaciones registra tu convenio y prueba cada medio de pago antes de activarlo.</p>${p.pruebas.length ? `<p class="peq num" style="margin-top:8px">${ok} de ${p.pruebas.length} pruebas superadas</p>` : ''}</div>`
    }
    case 8: return `<div class="accion-cliente verde" id="accion"><h3>Tu servicio pasó todas las pruebas</h3><p class="mut peq" style="margin-top:4px">Operaciones lo pasará a producción y te avisaremos cuando esté activo. Ya te enviamos las instrucciones para tus pagadores.</p></div>`
  }
  return `<div class="accion-cliente gris" id="accion"><h3>${esc(siguientePaso(exp))}</h3></div>`
}

function tablaOferta(exp) {
  const o = exp.oferta, s = exp.servicio
  const filas = [
    ['Comisión por pago recibido', `${q(o.porTx)}${o.excepcion ? ` (tarifa ${q(o.porTxTarifa)})` : ''}`],
    ...(o.cargoCheque ? [['Cargo por cheque de otro banco', q(o.cargoCheque)]] : []),
    ['Mínimo mensual', q(o.minimo)],
    ['Estimado mensual', `${q(o.estimadoMensual)} (${num(s.volumen)} pagos)`],
    ['Acreditación', o.acreditacion === 't0' ? 'Mismo día hábil' : 'Día hábil siguiente'],
    ['Cuenta de acreditación', s.cuenta],
    ['Reporte diario', `${s.reporteFormato} a ${s.reporteCorreo}`],
    ['Vigencia de la oferta', `hasta el ${fecha(o.vence)}`],
  ]
  return `<table class="tabla oferta-tabla" style="margin-top:12px"><tbody>${filas.map(([k, v]) => `<tr><td>${k}</td><td class="num">${esc(v)}</td></tr>`).join('')}</tbody></table>`
}

function documentoConvenio(exp) {
  return `<div class="doc-legal"><h4>CONVENIO DE COBRO POR CUENTA AJENA · ${exp.id} · v${exp.convenio.version}</h4>
    ${clausulasConvenio(exp).map((c) => `<p class="${c.excepcion ? 'ex' : ''}"><b>${c.n}. ${c.titulo}.</b> ${esc(c.texto)}</p>`).join('')}</div>`
}

function firmantesHTML(f, detalle = false) {

    : f.estado === 'expirada' && x.estado === 'pendiente' ? '<span class="chip error">Venció sin firmar</span>' : x.estado === 'pendiente' ? '<span class="chip aviso">Pendiente</span>' : '<span class="chip">En espera</span>'
  const sesion = (x) => { const s = detalle && (f.sesiones || []).find((y) => y.orden === x.orden); return s && x.estado !== 'firmado' ? `<br><span class="mini mut">Sesión <span class="webhook">${esc(s.url.replace('https://', ''))}</span> · vence ${fechaHora(s.vence)}</span>` : '' }
  return `<div class="col" style="margin-top:12px;gap:8px">${f.firmantes.map((x) => `<div class="fila-e peq" style="align-items:flex-start"><span><b>${x.orden}. ${esc(x.nombre)}</b><br><span class="mut mini">${esc(x.rol)} · ${x.metodo}</span>${detalle ? `<br><span class="mini mut">${esc(x.identificacion)} · ${esc(x.contacto)}</span>` : ''}${sesion(x)}</span>${chip(x)}</div>`).join('')}</div>`
}

const botonesDescarga = (exp) => exp.firma && exp.firma.estado === 'completada'

  : ''

function portalAsesor() {
  const mios = db.expedientes.filter((e) => e.asesor === persona('asesor'))
  return `<div class="cab-pag">
      <div><h2>Solicitudes de mis clientes</h2><p>${persona('asesor')} · ${ROLES.asesor.cargo}</p></div>
      <button class="btn" data-a="iniciar">Nueva solicitud para un cliente</button>

    <div class="aviso-linea info" style="margin-bottom:16px">${icono('info')}<span>Como asesor puedes crear, completar y dar seguimiento. La aceptación de la oferta y la firma siempre las hace el representante legal (hallazgo H18).</span></div>
    <div class="tarjeta" style="padding:8px 8px 4px"><div class="envoltura-tabla"><table class="tabla">
      <thead><tr><th>Expediente</th><th>Empresa</th><th>Etapa</th><th>Estado</th><th>SLA</th><th>Siguiente paso</th></tr></thead>
      <tbody>${mios.map((e) => `<tr class="clic ${e.vivo ? 'vivo' : ''}" data-a="asesor-abrir" data-v="${e.id}"><td class="num neg">${e.id}</td><td>${esc(e.empresa.razon)}</td><td>${e.etapa}. ${ETAPAS[e.etapa - 1].nombre}</td><td>${chipEstado(e)}</td><td>${chipSemaforo(e)}</td><td class="peq">${esc(siguientePaso(e))}</td></tr>`).join('')}</tbody>
    </table></div></div>`
}

function siguientePaso(exp) {
  if (exp.estado === 'rechazado') return 'Cerrado: rechazado'
  if (exp.estado === 'activo') return 'Servicio activo'
  if (exp.estado === 'observado') return 'Cliente: resolver la observación'
  switch (exp.etapa) {
    case 1: return 'Cliente: completar y enviar la solicitud'
    case 2: return 'Sistema y Agente 1: validar'
    case 3: {
      const p = ['comercial', 'riesgos', 'cumplimiento'].filter((a) => exp.evaluacion[a].estado === 'pendiente').map((a) => ROLES[a].nombre)
      return p.length ? `${p.join(', ')}: decidir la evaluación` : 'Sistema: consolidar'
    }
    case 4: return { borrador: 'Comercial: revisar y enviar la oferta', enviada: 'Cliente: aceptar o pedir ajuste', ajuste: 'Comercial: responder el ajuste', vencida: 'Comercial: renovar la oferta vencida', aceptada: 'Sistema: generar convenio' }[exp.oferta.estado]
    case 5: return { revision_cliente: 'Cliente: revisar el convenio', revision_legal: 'Legal: aprobar la versión final', ajuste_cliente: 'Legal: gestionar nueva versión', aprobado: 'Sistema: enviar a firma' }[exp.convenio.estado]
    case 6: return { enviada: 'Cliente: firmar', firmada_cliente: 'Banrural: la firma del apoderado', rechazada: 'Legal: reenviar o cancelar, porque no firmó', expirada: 'Legal: reenviar o cancelar, porque venció el enlace' }[exp.firma.estado] || ''
    case 7: return { pendiente: 'Operaciones: crear la parametrización', configurando: 'Operaciones: registrar la configuración', probando: 'QA: correr las pruebas', listo: 'Operaciones: activar' }[exp.param.estado]
    case 8: return 'Operaciones: pasar a producción'
  }
  return ''
}

// «Legal: aprobar la versión final» a media frase: «aprobar la versión final (Legal)», sin dos «dos puntos» seguidos.
function pasoEnFrase(exp) {
  const p = siguientePaso(exp), i = p.indexOf(': ')
  return i < 0 ? p : `${p.slice(i + 2)} (${p.slice(0, i)})`
}

// ── backoffice.js ──
/* Vista B — Backoffice (Comercial, Riesgos, Cumplimiento, Legal). [D §3]: bandejas, expediente 360°,
 * observaciones, aprobaciones, SLA, trazabilidad y documentos. La IA prepara; las personas deciden. */

const AREAS_EVAL = ['comercial', 'riesgos', 'cumplimiento']

function pendienteDe(exp, rol) {
  if (['rechazado', 'activo'].includes(exp.estado)) return false
  if (exp.etapa === 3 && exp.evaluacion && AREAS_EVAL.includes(rol)) return exp.evaluacion[rol].estado === 'pendiente'
  if (exp.etapa === 4 && rol === 'comercial') return ['borrador', 'ajuste', 'vencida'].includes(exp.oferta.estado)
  if (exp.etapa === 5 && rol === 'legal') return ['revision_legal', 'ajuste_cliente'].includes(exp.convenio.estado) && !exp.obs.some((o) => o.area === 'legal' && o.estado === 'abierta')
  if (exp.etapa === 6 && rol === 'legal') return ['firmada_cliente', 'rechazada', 'expirada'].includes(exp.firma.estado)
  return false
}

function vistaBackoffice() {
  const mia = db.expedientes.filter((e) => pendienteDe(e, ui.rol))
  const r = ROLES[ui.rol]
  return `<div class="app">
    <aside class="lateral">
      <div class="grupo">Backoffice · ${r.nombre}</div>
      <button class="item ${ui.bo.seccion === 'bandeja' && !ui.bo.expId ? 'act' : ''}" data-a="bo-seccion" data-v="bandeja">${icono('bandeja')}Mi bandeja <span class="cuenta">${mia.length}</span></button>
      <button class="item ${ui.bo.seccion === 'todos' && !ui.bo.expId ? 'act' : ''}" data-a="bo-seccion" data-v="todos">${icono('carpeta')}Todos los expedientes</button>
      <div class="quien"><span class="avatar">${iniciales(r.persona)}</span><span><b>${r.persona}</b><br><span class="mut mini">${r.cargo}</span></span></div>
    </aside>
    <main class="principal">${ui.bo.expId ? expediente360(buscarExp(ui.bo.expId)) : bandeja(mia)}</main>
  </div>`
}
